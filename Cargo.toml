[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/Loft-902-Co-LLC/open-ferry-ai-proxy"
publish = false

[workspace.dependencies]
open-ferry-core = { path = "crates/open-ferry-core" }
open-ferry-translate = { path = "crates/open-ferry-translate" }
open-ferry-server = { path = "crates/open-ferry-server" }
open-ferry-management = { path = "crates/open-ferry-management" }
open-ferry-providers = { path = "crates/open-ferry-providers" }
open-ferry-dashboard = { path = "crates/open-ferry-dashboard" }
open-ferry-tui = { path = "crates/open-ferry-tui" }
open-ferry-update = { path = "crates/open-ferry-update" }
open-ferry-supervisor = { path = "crates/open-ferry-supervisor" }
# preserve_order keeps client key order; arbitrary_precision keeps number text
# exact (e.g. 64-bit IDs in tool inputs), matching upstream's raw-byte handling.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

# Debug builds hash whole installed binaries (supervised installs, staging
# checks); unoptimized sha2 is far too slow for that. Applies to every sha2
# version in the tree. Nothing else is optimized.
[profile.dev.package.sha2]
opt-level = 3

# Smaller, faster binaries: measured ~11% less CPU per request and 31% smaller.
[profile.release]
lto = "fat"
codegen-units = 1
