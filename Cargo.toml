[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Loft-902-Co-LLC/open-ferry-ai-proxy"
publish = false

[workspace.dependencies]
open-ferry-core = { path = "crates/open-ferry-core" }
open-ferry-translate = { path = "crates/open-ferry-translate" }
open-ferry-server = { path = "crates/open-ferry-server" }
open-ferry-management = { path = "crates/open-ferry-management" }
open-ferry-providers = { path = "crates/open-ferry-providers" }
open-ferry-tui = { path = "crates/open-ferry-tui" }
# preserve_order keeps client key order; arbitrary_precision keeps number text
# exact (e.g. 64-bit IDs in tool inputs), matching upstream's raw-byte handling.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
