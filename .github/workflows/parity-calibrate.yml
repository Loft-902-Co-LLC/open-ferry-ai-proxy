name: Parity (calibration)

on:
  workflow_dispatch:
    # The run calibrates the commit it was dispatched on (`--ref <branch>`),
    # never another checkout, so the job only builds code from that ref.
    inputs:
      expect-sha:
        description: 'Optional full 40-hex SHA the dispatched ref must be at'
        required: false
        type: string
      profiles:
        description: 'Comma-separated profiles (pr or random:seed)'
        type: string
        default: 'pr,500:11,500:12,500:38,500:39,5000:30,5000:31,5000:32,5000:33,5000:34,5000:35,5000:36,5000:37,5000:38,5000:39'
      timeout-minutes:
        description: 'Per-job timeout, integer from 120 to 360 minutes'
        type: number
        default: 150

permissions:
  contents: read

concurrency:
  group: parity-calibrate-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ref: ${{ steps.plan.outputs.ref }}
      timeout: ${{ steps.plan.outputs.timeout }}
    steps:
      - name: Validate inputs and plan profiles
        id: plan
        env:
          CALIBRATION_REF: ${{ github.sha }}
          EXPECT_SHA: ${{ inputs.expect-sha }}
          PROFILES: ${{ inputs.profiles }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
        run: |
          python3 - <<'PY'
          import json, os, re
          ref = os.environ['CALIBRATION_REF']
          expect = os.environ['EXPECT_SHA'].strip()
          if expect:
              if not re.fullmatch(r'[0-9a-fA-F]{40}', expect):
                  raise SystemExit('expect-sha must be a full 40-hex commit SHA')
              if expect.lower() != ref.lower():
                  raise SystemExit(f'dispatched ref is at {ref}, not the expected {expect}')
          timeout = float(os.environ['TIMEOUT'])
          if not 120 <= timeout <= 360 or not timeout.is_integer():
              raise SystemExit('timeout-minutes must be an integer from 120 to 360')
          allowed = {'pr': (1, 25)}
          allowed.update({f'500:{seed}': (seed, 500) for seed in (11, 12, 38, 39)})
          allowed.update({f'5000:{seed}': (seed, 5000) for seed in range(30, 40)})
          profiles = [p.strip() for p in os.environ['PROFILES'].split(',')]
          if any(p not in allowed for p in profiles) or len(set(profiles)) != len(profiles):
              raise SystemExit('profiles must be a nonempty, unique subset of the default profiles')
          matrix = {'include': [dict(profile=p.replace(':', '-'), seed=allowed[p][0],
                                     random=allowed[p][1]) for p in profiles]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'matrix={json.dumps(matrix)}\nref={ref.lower()}\ntimeout={int(timeout)}\n')
          PY

  calibrate:
    name: config-save ${{ matrix.profile }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact commit and upstream gitlink
        env:
          CALIBRATION_REF: ${{ needs.plan.outputs.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$CALIBRATION_REF"
          expected=$(git rev-parse HEAD:reference/cliproxyapi)
          test "$(git -C reference/cliproxyapi rev-parse HEAD)" = "$expected"
      # Same setup and explicit harness-cache paths as parity-scheduled.yml,
      # with the calibration toolchain fixed at the requested Go 1.26.10.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            target/parity/go-build
          key: parity-go-v1-${{ runner.os }}-1.26.10-${{ hashFiles('reference/cliproxyapi/go.sum', 'tools/parity/go/**') }}
          restore-keys: parity-go-v1-${{ runner.os }}-1.26.10-
      - name: Build release parity tool
        run: |
          rustup toolchain install --profile minimal
          cargo build --locked --release -p open-ferry-parity
      - name: Collect observation and metadata
        env:
          CALIBRATION_REF: ${{ needs.plan.outputs.ref }}
          PROFILE: ${{ matrix.profile }}
          SEED: ${{ matrix.seed }}
          RANDOM_COUNT: ${{ matrix.random }}
        run: |
          mkdir -p calibration
          started=$SECONDS
          set +e
          target/release/open-ferry-parity \
            --upstream reference/cliproxyapi --suite config-save \
            --seed "$SEED" --random "$RANDOM_COUNT" --show 0 --jobs "$(nproc)" \
            --observation calibration/obs.json --summary calibration/summary.md
          status=$?
          set -e
          export PARITY_EXIT_CODE=$status PARITY_WALL_SECONDS=$((SECONDS - started))
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          meta = dict(ref=os.environ['CALIBRATION_REF'], profile=os.environ['PROFILE'],
                      gitlink=command('git', 'rev-parse', 'HEAD:reference/cliproxyapi'),
                      go_version=command('go', 'version'), runner_os=os.environ['RUNNER_OS'],
                      wall_seconds=int(os.environ['PARITY_WALL_SECONDS']),
                      exit_code=int(os.environ['PARITY_EXIT_CODE']))
          pathlib.Path('calibration/meta.json').write_text(json.dumps(meta, indent=2) + '\n')
          PY
          if [[ -f calibration/summary.md ]]; then
            cat calibration/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ $status != 0 && $status != 1 ]]; then exit "$status"; fi
          test -s calibration/obs.json
          test -s calibration/summary.md
      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-save-${{ matrix.profile }}
          path: calibration/
          if-no-files-found: error
          retention-days: 30

  combine:
    needs: [plan, calibrate]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact commit and upstream gitlink
        env:
          CALIBRATION_REF: ${{ needs.plan.outputs.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$CALIBRATION_REF"
          expected=$(git rev-parse HEAD:reference/cliproxyapi)
          test "$(git -C reference/cliproxyapi rev-parse HEAD)" = "$expected"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: config-save-*
          path: observations
      - name: Verify every planned observation and write manifest
        env:
          CALIBRATION_REF: ${{ needs.plan.outputs.ref }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path('observations')
          planned = json.loads(os.environ['MATRIX'])['include']
          expected = {f"config-save-{p['profile']}" for p in planned}
          # download-artifact extracts a lone matching artifact straight into
          # its path, without the per-artifact directory it makes for several.
          entries = list(root.iterdir())
          if len(planned) == 1 and entries and all(p.is_file() for p in entries):
              (single,) = expected
              root.rename('observation-single')
              root.mkdir()
              pathlib.Path('observation-single').rename(root / single)
          if {p.name for p in root.iterdir()} != expected:
              raise SystemExit('missing or unexpected profile artifact')
          gitlink = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD:reference/cliproxyapi'], text=True).strip()
          fingerprint = None
          rows = []
          for profile in planned:
              directory = root / f"config-save-{profile['profile']}"
              obs = json.loads((directory / 'obs.json').read_text())
              meta = json.loads((directory / 'meta.json').read_text())
              if meta['ref'] != os.environ['CALIBRATION_REF'] or meta['gitlink'] != gitlink:
                  raise SystemExit(f'{directory}: mismatched ref or gitlink')
              if meta['profile'] != profile['profile'] or meta['exit_code'] not in (0, 1):
                  raise SystemExit(f'{directory}: invalid run metadata')
              if (obs['seed'], obs['random'], obs['selected']) != (profile['seed'], profile['random'], False):
                  raise SystemExit(f'{directory}: mismatched observation profile')
              current = obs['fingerprint']
              if set(current) != {'classifier_version', 'upstream_pin', 'generator_sha256'}:
                  raise SystemExit(f'{directory}: invalid fingerprint keys')
              if current['upstream_pin'] != gitlink:
                  raise SystemExit(f'{directory}: fingerprint upstream differs from gitlink')
              if fingerprint is None:
                  fingerprint = current
              if current != fingerprint or obs['non_certification'] != 0:
                  raise SystemExit(f'{directory}: fingerprint mismatch or non-certification failures')
              rows.append(dict(profile=profile['profile'], cases=obs['cases'],
                               different=obs['different'], fingerprint=current,
                               observation=str(directory / 'obs.json'), metadata=meta))
          output = pathlib.Path('combined')
          output.mkdir()
          (output / 'manifest.json').write_text(json.dumps(
              dict(ref=os.environ['CALIBRATION_REF'], gitlink=gitlink, profiles=rows), indent=2) + '\n')
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build release tool and check complete baseline refresh
        run: |
          rustup toolchain install --profile minimal
          cargo build --locked --release -p open-ferry-parity
          observations=()
          for file in observations/config-save-*/obs.json; do
            observations+=(--baseline-observation "$file")
          done
          # No --baseline: require a complete full refresh, never an incremental one.
          target/release/open-ferry-parity \
            --write-baseline "$RUNNER_TEMP/config-save-baseline.json" "${observations[@]}"
          cp "$RUNNER_TEMP/config-save-baseline.json" combined/baseline.json
      - name: Upload combined manifest and accepted baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-combined
          path: combined/
          if-no-files-found: error
          retention-days: 30
