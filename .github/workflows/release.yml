name: Release

# Pushing a tag vX.Y.Z builds open-ferry for each target, writes SHA256SUMS
# for the archives and the install scripts, attests their build provenance
# and creates a draft GitHub release for the maintainer to review and
# publish. It then builds the container image from the static Linux
# archives, for linux/amd64 and linux/arm64, pushes it to
# ghcr.io/loft-902-co-llc/open-ferry and attests it.
#
# Running the workflow by hand (workflow_dispatch) is a dry run: it builds,
# packages and checksums the same archives, builds and tests the image for
# both platforms, and keeps them as workflow artifacts, but attests,
# publishes and pushes nothing.
#
# See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Read the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build-date: ${{ steps.meta.outputs.build-date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version, commit and build date
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          # The binary reports the workspace version, so the open-ferry crate
          # must take it from the workspace.
          if ! grep -qx 'version.workspace = true' crates/open-ferry/Cargo.toml; then
            echo "::error::crates/open-ferry/Cargo.toml doesn't take its version from the workspace"
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The workspace version '$version' isn't MAJOR.MINOR.PATCH with an optional pre-release part"
            exit 1
          fi
          if [ "$EVENT" = push ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "::error::The tag $TAG doesn't match the workspace version $version: tag v$version, or bump the version first"
              exit 1
            fi
            if ! awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section"
              exit 1
            fi
          else
            echo "::notice::Dry run: building $version from $GITHUB_REF without publishing"
          fi
          prerelease=false
          if [[ $version == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"
            # One build date for every target.
            echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  dashboard:
    name: Build the dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache, as no cargo cache: every package comes from the
      # registry, checked against package-lock.json's integrity hashes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dashboard/.nvmrc
          package-manager-cache: false

      # --ignore-scripts: no package runs code at install time.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check the build
        run: |
          for file in index.html third-party-licenses.txt; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::The dashboard build has no dist/$file"
              exit 1
            fi
          done

      # Built once, so every target embeds the same files. The name mustn't
      # match open-ferry-*, which the checksum and publish jobs collect.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error

  rust-licenses:
    name: Write the Rust crates' licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal

      # Pinned, and built from the versions in its own Cargo.lock.
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      # The crates, checked against Cargo.lock. cargo-about then runs offline.
      - name: Fetch the crates
        run: cargo fetch --locked

      # One file per target, from that target's build of open-ferry. Fails if
      # a crate's license isn't in about.toml's accepted list.
      - name: Write the licenses
        run: python3 .github/scripts/rust-licenses.py rust-licenses

      # Written once, on one runner, for every target. The name mustn't match
      # open-ferry-*, which the checksum and publish jobs collect.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-licenses
          path: rust-licenses
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [meta, dashboard, rust-licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target builds natively on a runner of its own architecture:
          # rustls uses aws-lc-rs, whose C code wants the target's toolchain.
          # The Linux targets build in the container below, not on the
          # runner's own Ubuntu. Labels are pinned so that a move of
          # ubuntu-latest or macos-latest doesn't change a release unseen.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # The static Linux builds, for any Linux, Alpine's included, and
          # for the container image.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    # The Linux binaries need the glibc of the system they were linked on, so
    # they build in Debian 11 (bullseye), whose glibc is 2.31: the official
    # Rust image, pinned by digest. The digest names a multi-platform index,
    # so each runner pulls its own architecture. The image has what aws-lc-rs
    # builds with (GCC 10.2; no CMake, Go or NASM needed on Linux) and
    # rustup, which installs the toolchain rust-toolchain.toml names, as on
    # the other runners. The musl targets build in the Rust Alpine image
    # (RUST_ALPINE below), which their build step starts itself; the others
    # build on the runner itself.
    container: ${{ endsWith(matrix.target, '-linux-gnu') && 'docker.io/library/rust:1-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9' || null }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      # Read only when building for Linux: the newest glibc the binaries may
      # need, that of the container above. The build fails if they need a
      # newer one.
      GLIBC_FLOOR: "2.31"
      VERSION: ${{ needs.meta.outputs.version }}
      OPEN_FERRY_COMMIT: ${{ needs.meta.outputs.commit }}
      OPEN_FERRY_BUILD_DATE: ${{ needs.meta.outputs.build-date }}
      # Read only when building for macOS: the oldest macOS the binaries run
      # on, for the Rust and the C code alike.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Link the C runtime statically, so Windows users don't need the Visual
      # C++ Redistributable. Applies only to that target.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # Read only when building for musl: the official Rust image on Alpine,
      # pinned by digest. The digest names a multi-platform index, so each
      # runner pulls its own architecture. Its GCC and musl-dev build the C
      # code of aws-lc-rs and SQLite for musl, natively. It runs in a step,
      # not as the job's container, as GitHub runs no JavaScript action in
      # an Alpine container on arm64.
      RUST_ALPINE: docker.io/library/rust:1-alpine3.24@sha256:0cce0a5e0e8ba67b455257a3a02a1d99005f382748789d6464460028810f1627
      # Static linking is the musl targets' default; it's set here too, so
      # that a change of default can't make a dynamic binary. The static
      # check below would fail one anyway.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
      # Where a static binary's -h runs: Alpine, which has no glibc. The
      # digest names a multi-platform index.
      ALPINE: docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      # Keeps macOS tar from adding ._ files for extended attributes.
      COPYFILE_DISABLE: "1"
      # A release must embed the dashboard: without dashboard/dist the build
      # fails instead of serving the "built without the dashboard" page.
      OPEN_FERRY_REQUIRE_DASHBOARD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-licenses
          path: rust-licenses

      # No cache: a release is built from scratch, so nothing a cache holds
      # can find its way into it.
      - name: Install the toolchain from rust-toolchain.toml
        if: ${{ !endsWith(matrix.target, '-linux-musl') }}
        run: rustup toolchain install --profile minimal

      - name: Check that the runner builds natively
        if: ${{ !endsWith(matrix.target, '-linux-musl') }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "::error::The runner's host is $host, not $TARGET"
            exit 1
          fi

      - name: Build
        if: ${{ !endsWith(matrix.target, '-linux-musl') }}
        run: cargo build --release --locked -p open-ferry --target "$TARGET"

      # build-musl.sh installs the toolchain, checks that the build is
      # native and builds, as the three steps above do.
      - name: Build (static, in Alpine)
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          docker run --rm \
            -e TARGET -e OPEN_FERRY_COMMIT -e OPEN_FERRY_BUILD_DATE \
            -e OPEN_FERRY_REQUIRE_DASHBOARD -e CARGO_TERM_COLOR -e CARGO_INCREMENTAL \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            "$RUST_ALPINE" sh .github/scripts/build-musl.sh

      # No program interpreter and no shared libraries; then -h on Alpine,
      # which has no glibc.
      - name: Check that the binary is static
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sh .github/scripts/check-static.sh "target/$TARGET/release/open-ferry" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/target/$TARGET/release/open-ferry:/usr/local/bin/open-ferry:ro" \
            "$ALPINE" open-ferry -h

      - name: Check the glibc the binary needs
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          # The newest glibc symbol version the binary links against.
          glibc=$(objdump -T "target/$TARGET/release/open-ferry" | { grep -o 'GLIBC_[0-9][0-9.]*' || true; } | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          if [ -z "$glibc" ]; then
            echo "::error::$TARGET has no versioned glibc symbols, so its glibc can't be checked"
            exit 1
          fi
          echo "$TARGET needs glibc $glibc; the floor is $GLIBC_FLOOR" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n' "$GLIBC_FLOOR" "$glibc" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::$TARGET needs glibc $glibc, newer than the floor $GLIBC_FLOOR"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          name="open-ferry-$VERSION-$TARGET"
          exe=open-ferry
          if [ "$RUNNER_OS" = Windows ]; then exe=open-ferry.exe; fi
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$exe" LICENSE README.md config.example.yaml "dist/$name/"
          if [ "$RUNNER_OS" != Windows ]; then chmod 755 "dist/$name/$exe"; fi
          cp -R licenses "dist/$name/"
          # The licenses of the npm packages built into the dashboard.
          cp dashboard/dist/third-party-licenses.txt "dist/$name/licenses/dashboard-third-party-licenses.txt"
          # The licenses of the Rust crates built into this target's binary.
          if [ ! -s "rust-licenses/$TARGET.txt" ]; then
            echo "::error::The rust-licenses artifact has no $TARGET.txt: add the target to .github/scripts/rust-licenses.py"
            exit 1
          fi
          cp "rust-licenses/$TARGET.txt" "dist/$name/licenses/rust-third-party-licenses.txt"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows' own tar is bsdtar, which writes zip files; Git Bash's
            # tar doesn't.
            "$(cygpath "$SYSTEMROOT")/System32/tar.exe" -a -cf "$name.zip" "$name"
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          rm -rf "$name"
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ferry-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  checksums:
    name: Write SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: open-ferry-*
          path: dist
          merge-multiple: true

      # The install scripts are release assets too, listed in SHA256SUMS, so
      # that the one-line installs fetch them from the latest release.
      - name: Add the install scripts
        run: |
          mkdir scripts
          cp source/install.sh source/install.ps1 scripts/
          cp scripts/install.sh scripts/install.ps1 dist/

      - name: Write SHA256SUMS
        run: |
          export LC_ALL=C
          cd dist
          shopt -s nullglob
          archives=(open-ferry-*.tar.gz open-ferry-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No archives were downloaded"
            exit 1
          fi
          sha256sum -- "${archives[@]}" install.sh install.ps1 | sort -k 2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ferry-SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

      # Named open-ferry-*, so the publish job collects them with the
      # archives.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-ferry-install-scripts
          path: scripts
          if-no-files-found: error

  publish:
    name: Create the draft release
    needs: [meta, checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that may write: the release (contents), and the
    # attestations, signed with the workflow's OIDC token (id-token).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: open-ferry-*
          path: dist
          merge-multiple: true

      - name: Check the archives against SHA256SUMS
        run: |
          export LC_ALL=C
          cd dist
          sha256sum --check --strict SHA256SUMS
          # A name may carry sha256sum's '*' binary-mode mark.
          listed=$(awk '{ name = $2; sub(/^\*/, "", name); print name }' SHA256SUMS | sort)
          present=$(ls | grep -vx SHA256SUMS | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::dist holds files SHA256SUMS doesn't list, or lacks some it does"
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/open-ferry-*.tar.gz
            dist/open-ferry-*.zip
            dist/install.sh
            dist/install.ps1

      - name: Write the release notes from CHANGELOG.md
        run: |
          python3 - > "$RUNNER_TEMP/notes.md" <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          heading = f"## [{version}] - "
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          starts = [i for i, line in enumerate(lines) if line.startswith(heading)]
          if not starts:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          notes = []
          for line in lines[starts[0] + 1:]:
              # The section ends at the next version or the link definitions.
              if line.startswith("## ") or re.match(r"\[[^\]]+\]: ", line):
                  break
              notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              sys.exit(f"The CHANGELOG.md section for {version} is empty")
          print(text)
          print()
          print("To check a download against SHA256SUMS and its build provenance, see "
                "[Install](https://github.com/{}/blob/{}/README.md#install).".format(
                    os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]))
          PY
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --draft \
            --verify-tag \
            --title "open-ferry $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

  image:
    name: Build the container image
    needs: [meta, checksums, publish]
    # On a tag, after the draft release; on a dry run, which has no release,
    # after SHA256SUMS.
    if: >-
      !cancelled()
      && needs.checksums.result == 'success'
      && (needs.publish.result == 'success'
      || (github.event_name != 'push' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job that may push a package: the image (packages), and its
    # attestation, signed with the workflow's OIDC token (id-token).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      IMAGE: ghcr.io/loft-902-co-llc/open-ferry
      # Read by build-image.sh.
      SOURCE: https://github.com/${{ github.repository }}
      REVISION: ${{ github.sha }}
      CREATED: ${{ needs.meta.outputs.build-date }}
      # BuildKit in a container of its own, pinned by digest, rather than
      # the runner's Docker: it exports a multi-platform image.
      BUILDKIT: docker.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's build context: the two static archives and SHA256SUMS,
      # which docker/Dockerfile checks them against again.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: open-ferry-*-linux-musl
          path: image-context
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-ferry-SHA256SUMS
          path: image-context

      - name: Check the archives against SHA256SUMS
        working-directory: image-context
        run: |
          export LC_ALL=C
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="open-ferry-$VERSION-$target.tar.gz"
            line=$(awk -v want="$archive" '{ name = $2; sub(/^\*/, "", name); if (name == want) print }' SHA256SUMS)
            if [ -z "$line" ]; then
              echo "::error::SHA256SUMS doesn't list $archive"
              exit 1
            fi
            printf '%s\n' "$line" | sha256sum --check --strict
          done

      - name: Set up BuildKit
        run: docker buildx create --name open-ferry --driver docker-container --driver-opt "image=$BUILDKIT" --use --bootstrap

      # build-image.sh sets the labels, the annotations and the timestamps
      # (from the build date), so the three builds below make one image.
      - name: Build the image for linux/amd64 and linux/arm64
        run: sh .github/scripts/build-image.sh image-context linux/amd64,linux/arm64 --output "type=oci,dest=$RUNNER_TEMP/open-ferry-image.tar"

      # The amd64 image, from the build above's cache, run as test-image.sh
      # describes: nothing it starts reaches a provider.
      - name: Test the linux/amd64 image
        run: |
          sh .github/scripts/build-image.sh image-context linux/amd64 --load --tag open-ferry:test
          sh .github/scripts/test-image.sh open-ferry:test

      # A dry run keeps the image as an OCI archive, for `docker load` or
      # `skopeo`. The name mustn't match open-ferry-*.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUSH != 'true'
        with:
          name: container-image
          path: ${{ runner.temp }}/open-ferry-image.tar
          if-no-files-found: error
          retention-days: 7

      - name: Sign in to GHCR
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The same image, from the cache, pushed as VERSION and, unless it's a
      # pre-release, latest.
      - name: Push the image
        id: push
        if: env.PUSH == 'true'
        run: |
          names=("$IMAGE:$VERSION")
          if [ "$PRERELEASE" != true ]; then names+=("$IMAGE:latest"); fi
          tags=()
          for name in "${names[@]}"; do tags+=(--tag "$name"); done
          sh .github/scripts/build-image.sh image-context linux/amd64,linux/arm64 \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" --push "${tags[@]}"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The push reported no image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest as ${names[*]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Sign out of GHCR
        if: always() && env.PUSH == 'true'
        run: docker logout ghcr.io
