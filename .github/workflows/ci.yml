name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks again on each PR as it would land.
  merge_group:
  # Every check, as the merge queue runs them, on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

# What runs when:
# - A PR runs parity, the tests, clippy, the docs, the licenses, the dashboard and the
#   install scripts. The release builds and the blue-green tests, the slowest,
#   are left to the merge queue; skipped, they count as passed on the PR.
# - The merge queue and workflow_dispatch run everything.
# - A push to main, which is a PR that landed, runs no tests. It builds what
#   the Rust caches hold when main's caches don't have it yet, and saves them.
# - When only files under dashboard/ changed, the Rust jobs are skipped;
#   dashboard-real still builds the binary with those embedded assets.
# The checks the ruleset requires keep their names. check and blue-green sum
# up the jobs that do the work, per OS.

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      dashboard-real: ${{ steps.diff.outputs.dashboard-real }}
      parity: ${{ steps.diff.outputs.parity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A PR's merge commit is compared with its first parent, the base
      # branch; a merge group with the queue's base; a push with the commit
      # before it. Anything else, or a comparison that fails, counts as a
      # Rust change. So does a file outside dashboard/ (docs/agents.md is
      # built into open-ferry), and a dashboard file a Rust test reads, which
      # crates/ names.
      - name: Whether Rust builds or reads anything that changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$(git rev-parse --verify --quiet 'HEAD^1' || true) ;;
            merge_group) base=$GROUP_BASE ;;
            push) base=$PUSH_BASE ;;
            *) base= ;;
          esac
          rust=true
          dashboard_real=true
          parity=true
          if [[ -n $base && $base != 0000000000000000000000000000000000000000 ]] &&
            git fetch --quiet --no-tags --depth=1 origin "$base" &&
            git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed" &&
            [[ -s $RUNNER_TEMP/changed ]]; then
            rust=false
            dashboard_real=false
            parity=false
            while IFS= read -r path; do
              if [[ $path != dashboard/* ]] || git grep --quiet --fixed-strings -e "$path" -- crates; then
                echo "Rust change: $path"
                rust=true
              fi
              if [[ $path == dashboard/* || $path == *.rs || $path == crates/* || $path == Cargo.* || $path == config.example.yaml || $path == release-keys.pub || $path == rust-toolchain.toml || $path == .cargo/* || $path == .github/workflows/ci.yml || $path == .github/actions/* || $path == docs/agents.md ]]; then
                dashboard_real=true
              fi
              case "$path" in
                crates/open-ferry-translate/*|crates/open-ferry-providers/*|crates/open-ferry-core/*|tools/parity/*|reference/cliproxyapi|reference/cliproxyapi/*|Cargo.lock|Cargo.toml|rust-toolchain.toml|.cargo/*|config.example.yaml|.gitmodules|.github/workflows/ci.yml|.github/workflows/parity-scheduled.yml|.github/scripts/run-parity.sh|.github/actions/setup-rust/*|.github/actions/save-rust-cache/*)
                  echo "Parity change: $path"
                  parity=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed"
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "dashboard-real=$dashboard_real" >> "$GITHUB_OUTPUT"
          echo "parity=$parity" >> "$GITHUB_OUTPUT"

  # Cheap enough for PRs too; its result belongs to the existing required
  # Ubuntu aggregate. Dispatch runs it even without a diff to compare.
  parity:
    needs: changes
    if: needs.changes.outputs.parity == 'true'
    uses: ./.github/workflows/parity-scheduled.yml
    with:
      seed: '1'
      random: '25'

  # Format, clippy, the tests and the docs. The Windows job runs the same
  # steps.
  tests-ubuntu:
    name: tests (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps: &tests-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: tests

      - name: Format
        if: github.event_name != 'push'
        run: cargo fmt --all --check

      - name: Clippy
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A push to main fills the cache: it builds what the tests need and
      # runs none.
      - name: Build the tests
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked --no-run

      - name: Test
        if: github.event_name != 'push'
        run: cargo test --workspace --locked --no-fail-fast

      # The generator runs every named fixture in the compiled Rust test
      # harness and checks the committed matrix. Reuse the existing tests
      # job and installed Python; no action or required check is added.
      - name: Compatibility evidence and generated document
        if: github.event_name != 'push'
        run: python -I .github/scripts/test_compatibility.py

      - name: Docs
        if: github.event_name != 'push'
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  tests-windows:
    name: tests (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      OPEN_FERRY_REQUIRE_ELEVATED_OWNER_TESTS: "1"
    steps: *tests-steps

  # What the release workflow ships carries none of the blue-green test
  # seams (see blue-green-tests): build it as it ships (the feature off) and
  # scan it for their strings.
  release-seams-ubuntu:
    name: release-seams (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &release-seams-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: release

      - name: Release builds hold no test seams
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          set -euo pipefail
          # The .rlib scan needs machine code; LTO leaves bitcode in it.
          # Feature gating is independent of LTO. The binary below is scanned
          # as shipped, with the workspace's LTO profile.
          CARGO_PROFILE_RELEASE_LTO=off cargo build --release --locked -p open-ferry-supervisor --lib --no-default-features --message-format=json > "$RUNNER_TEMP/supervisor-build.json"
          "$PYTHON" -I crates/open-ferry-supervisor/check-release.py "$RUNNER_TEMP/supervisor-build.json"
          cargo build --release --locked -p open-ferry --bin open-ferry --no-default-features --message-format=json > "$RUNNER_TEMP/open-ferry-build.json"
          "$PYTHON" -I crates/open-ferry/check-release.py "$RUNNER_TEMP/open-ferry-build.json"
          cargo build --release --locked -p open-ferry-update --example release-seam-check --no-default-features
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          "$PYTHON" -I crates/open-ferry-update/tests/check_release_seams.py "target/release/examples/release-seam-check$suffix"

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  release-seams-windows:
    name: release-seams (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps: *release-seams-steps

  # The same builds with the feature on, scanned with each checker's
  # --self-test: there the scans must find the seams, so a scan can't pass by
  # finding nothing. A job of its own, so that the two halves build side by
  # side. The feature changes none of the dependencies, so it shares
  # release-seams' cache and leaves saving it to that job: a push builds
  # nothing here.
  release-seams-feature-ubuntu:
    name: release-seams-feature (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &release-seams-feature-steps
      - if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event_name != 'push'
        uses: ./.github/actions/setup-rust
        with:
          cache: release

      - name: Feature builds hold the test seams
        if: github.event_name != 'push'
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          set -euo pipefail
          "$PYTHON" -I -m unittest discover -s crates/open-ferry -p test_check_release.py
          "$PYTHON" -I -m unittest discover -s crates/open-ferry-supervisor -p test_check_release.py
          cargo build --release --locked -p open-ferry-update --example release-seam-check --no-default-features --features blue-green-test
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          "$PYTHON" -I crates/open-ferry-update/tests/check_release_seams.py --self-test "target/release/examples/release-seam-check$suffix"
          # The .rlib scan needs machine code; LTO leaves bitcode in it.
          # Feature gating is independent of LTO. The binary below is scanned
          # as shipped, with the workspace's LTO profile.
          CARGO_PROFILE_RELEASE_LTO=off cargo build --release --locked -p open-ferry-supervisor --lib --no-default-features --features blue-green-test --message-format=json > "$RUNNER_TEMP/supervisor-feature-build.json"
          "$PYTHON" -I crates/open-ferry-supervisor/check-release.py --self-test "$RUNNER_TEMP/supervisor-feature-build.json"
          cargo build --release --locked -p open-ferry --bin open-ferry --no-default-features --features blue-green-test --message-format=json > "$RUNNER_TEMP/open-ferry-feature-build.json"
          "$PYTHON" -I crates/open-ferry/check-release.py --self-test "$RUNNER_TEMP/open-ferry-feature-build.json"

  release-seams-feature-windows:
    name: release-seams-feature (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps: *release-seams-feature-steps

  # The blue-green switch's test seams (worker faults, barriers, the
  # supervisor's isolation flags) are compiled only with this feature. The
  # supervisor's process tests run on it: against its fake worker, and
  # open-ferry's against the real one. Each process runs with the environment
  # cleaned, on its own data directory and endpoint, and its update checks go
  # to a closed loopback port. They take longer than everything else, so three
  # runners per OS share them; blue-green-shard.py picks each one's targets.
  blue-green-tests-ubuntu:
    name: blue-green (ubuntu-latest, ${{ matrix.shard }} of 3)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    strategy: &blue-green-shards
      fail-fast: false
      matrix:
        # A push to main only fills the cache, which one runner does.
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1, 2, 3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &blue-green-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own cache: the feature changes what these crates build.
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: blue-green

      # Pinned release assets, checked before extraction; no install action or
      # unverified fallback (the repository allows GitHub-owned actions only).
      - name: Install cargo-nextest
        shell: bash
        env:
          VERSION: 0.9.146
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              target=x86_64-unknown-linux-musl
              sha256=b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa
              temp="$RUNNER_TEMP"
              ;;
            Windows)
              target=x86_64-pc-windows-msvc
              sha256=809b01f2c94d031ab6cf5f4d4a4f477c8f51b69c96ab3cb2fe4db7ecb222d0d3
              temp=$(cygpath -u "$RUNNER_TEMP")
              ;;
            macOS)
              target=universal-apple-darwin
              sha256=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8
              temp="$RUNNER_TEMP"
              ;;
            *) echo "unsupported nextest platform: $RUNNER_OS" >&2; exit 1 ;;
          esac
          name="cargo-nextest-$VERSION-$target.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$temp/$name" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/$name"
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "$sha256  $temp/$name" | shasum -a 256 --check --strict
          else
            echo "$sha256  $temp/$name" | sha256sum --check --strict
          fi
          mkdir "$temp/nextest-$VERSION"
          tar -xzf "$temp/$name" -C "$temp/nextest-$VERSION"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$temp/nextest-$VERSION" >> "$GITHUB_PATH"
          else
            echo "$temp/nextest-$VERSION" >> "$GITHUB_PATH"
          fi

      - name: Check the launchd GUI domain
        id: launchd
        if: runner.os == 'macOS' && matrix.shard == 1 && github.event_name != 'push'
        shell: bash
        run: |
          if launchctl print "gui/$(id -u)" > /dev/null 2> "$RUNNER_TEMP/launchd-probe.log"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::UNVERIFIED: this runner has no usable launchd GUI domain."
            cat "$RUNNER_TEMP/launchd-probe.log"
            echo "LaunchAgent run UNVERIFIED: no GUI domain." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clippy with the blue-green test seams
        if: matrix.shard == 1 && (github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true')
        run: cargo clippy -p open-ferry -p open-ferry-supervisor -p open-ferry-update --all-targets --locked --features blue-green-test -- -D warnings

      - name: Build the tests
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        run: cargo nextest run --profile ci -p open-ferry -p open-ferry-supervisor -p open-ferry-update --locked --features blue-green-test --no-run

      # Fail promptly on platform plumbing before the longer process matrix.
      - name: Check macOS ACLs and worker process plumbing
        if: runner.os == 'macOS' && matrix.shard == 1 && github.event_name != 'push'
        run: |
          cargo nextest run --profile ci -p open-ferry-supervisor --locked --features blue-green-test --lib -E 'test(trust::unix::) | test(endpoint::unix::)'
          cargo nextest run --profile ci -p open-ferry-supervisor --locked --features blue-green-test --test unix_process
          cargo nextest run --profile ci -p open-ferry-supervisor --locked --features blue-green-test --test process_stop -E 'test(=a_killed_supervisor_stays_a_zombie_until_the_guard_drops)'

      - name: This runner's share of the tests
        id: shard
        if: github.event_name != 'push'
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          "$PYTHON" -I .github/scripts/blue-green-shard.py "$RUNNER_TEMP/metadata.json" "$RUNNER_OS" "$SHARD" 3 >> "$GITHUB_OUTPUT"

      # The script passes on plain target names only, so its output can go
      # into the command line.
      - name: Test with the blue-green test seams
        if: github.event_name != 'push'
        run: cargo nextest run --profile ci -p open-ferry -p open-ferry-supervisor -p open-ferry-update --locked --features blue-green-test ${{ steps.shard.outputs.args }}

      - name: Doc tests with the blue-green test seams
        if: github.event_name != 'push' && steps.shard.outputs.doc == 'true'
        run: cargo test -p open-ferry -p open-ferry-supervisor -p open-ferry-update --locked --features blue-green-test --doc

      - name: Run and uninstall a real LaunchAgent
        if: steps.launchd.outputs.available == 'true'
        env:
          OFP_TEST_LAUNCHD: "1"
        run: cargo nextest run --profile ci -p open-ferry --locked --features blue-green-test --test process_launchd --run-ignored only --success-output immediate -E 'test(=a_user_launchagent_serves_and_uninstalls_within_its_exit_timeout)'

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  blue-green-tests-windows:
    name: blue-green (windows-latest, ${{ matrix.shard }} of 3)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    strategy: *blue-green-shards
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPEN_FERRY_REQUIRE_ELEVATED_OWNER_TESTS: "1"
    steps: *blue-green-steps

  blue-green-tests-macos:
    name: blue-green (macos-15, ${{ matrix.shard }} of 3)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    strategy: *blue-green-shards
    runs-on: macos-15
    timeout-minutes: 60
    steps: *blue-green-steps

  blue-green-tests-musl:
    name: blue-green (Alpine musl)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_ALPINE: docker.io/library/rust:1-alpine3.24@sha256:0cce0a5e0e8ba67b455257a3a02a1d99005f382748789d6464460028810f1627
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: blue-green-musl

      # Run in a step: GitHub's JavaScript actions need glibc. The tests and
      # their workers are built and run natively against Alpine's musl.
      - name: Build and test on Alpine
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -e CARGO_BUILD_JOBS=4 -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -e CARGO_TERM_COLOR -e EVENT \
            -e TEST_UID="$(id -u)" -e TEST_GID="$(id -g)" \
            "$RUST_ALPINE" sh -eu -c '
              apk add --no-cache clang cmake make perl linux-headers curl
              rustup toolchain install --profile minimal --component clippy
              rustc -vV
              test "$(rustc -vV | sed -n "s/^host: //p")" = x86_64-unknown-linux-musl
              name=cargo-nextest-0.9.146-x86_64-unknown-linux-musl.tar.gz
              curl --fail --silent --show-error --location --proto "=https" --tlsv1.2 \
                -o /tmp/nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/$name"
              echo "b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa  /tmp/nextest.tar.gz" | sha256sum -c -
              tar -xzf /tmp/nextest.tar.gz -C /usr/local/cargo/bin
              # Match the ordinary account on the other runners. A root container
              # deliberately relaxes the CLI privilege boundary for mounted configs.
              addgroup -g "$TEST_GID" bluegreen
              adduser -D -u "$TEST_UID" -G bluegreen bluegreen
              chown -R "$TEST_UID:$TEST_GID" /usr/local/cargo/registry
              su -s /bin/sh bluegreen -c "
                set -eu
                export HOME=/home/bluegreen PATH=/usr/local/cargo/bin:\$PATH
                cargo clippy -p open-ferry -p open-ferry-supervisor -p open-ferry-update --target x86_64-unknown-linux-musl --all-targets --locked --features blue-green-test -- -D warnings
                if [ \"$EVENT\" = push ]; then
                  cargo nextest run --profile ci -p open-ferry -p open-ferry-supervisor -p open-ferry-update --target x86_64-unknown-linux-musl --locked --features blue-green-test --no-run
                else
                  cargo nextest run --profile ci -p open-ferry -p open-ferry-supervisor -p open-ferry-update --target x86_64-unknown-linux-musl --locked --features blue-green-test
                  cargo test -p open-ferry -p open-ferry-supervisor -p open-ferry-update --target x86_64-unknown-linux-musl --locked --features blue-green-test --doc
                fi
              "
            '

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  # The required checks check and blue-green, one per OS: each passes when that
  # OS's jobs passed, or were skipped as the run's event allows (see the top).
  # They run unless the run was cancelled, so that a job that failed, or was
  # skipped because one it needs failed, fails them instead of their being
  # skipped, which would count as passed. Their matrix gives them the names the
  # ruleset requires; a skipped matrix job reports none of them, so a cancelled
  # run passes nothing.
  check:
    name: check (${{ matrix.os }})
    needs: [changes, parity, tests-ubuntu, tests-windows, release-seams-ubuntu, release-seams-windows, release-seams-feature-ubuntu, release-seams-feature-windows, dashboard-real]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jobs: parity tests-ubuntu release-seams-ubuntu release-seams-feature-ubuntu dashboard-real
            queue-only: release-seams-ubuntu release-seams-feature-ubuntu dashboard-real
          - os: windows-latest
            jobs: tests-windows release-seams-windows release-seams-feature-windows
            queue-only: release-seams-windows release-seams-feature-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: &results-steps
      - name: Results
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOBS: changes ${{ matrix.jobs }}
          QUEUE_ONLY: ${{ matrix.queue-only }}
          RUST: ${{ needs.changes.outputs.rust }}
          DASHBOARD_REAL: ${{ needs.changes.outputs.dashboard-real }}
          PARITY: ${{ needs.changes.outputs.parity }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed=0
          for job in $JOBS; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            echo "$job: $result"
            case $result in
              success) continue ;;
              # Skipped as planned: nothing Rust changed, or a PR leaves the
              # job to the merge queue.
              skipped)
                if [[ $job == parity ]]; then
                  if [[ $PARITY == false ]]; then continue; fi
                elif [[ $job == dashboard-real ]]; then
                  if [[ $DASHBOARD_REAL == false ]]; then continue; fi
                elif [[ $job != changes && $RUST == false ]]; then
                  continue
                fi
                if [[ $EVENT == pull_request && " $QUEUE_ONLY " == *" $job "* ]]; then continue; fi
                ;;
            esac
            echo "::error::$job: $result"
            failed=1
          done
          exit "$failed"

  blue-green:
    name: blue-green (${{ matrix.os }})
    needs: [changes, blue-green-tests-ubuntu, blue-green-tests-windows, blue-green-tests-macos, blue-green-tests-musl]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jobs: blue-green-tests-ubuntu blue-green-tests-macos blue-green-tests-musl
            queue-only: blue-green-tests-ubuntu blue-green-tests-macos blue-green-tests-musl
          - os: windows-latest
            jobs: blue-green-tests-windows
            queue-only: blue-green-tests-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *results-steps

  # What the release workflow's rust-licenses job does, so that a new crate
  # under a license about.toml doesn't accept fails here, not at release time.
  rust-licenses:
    name: rust-licenses
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal

      # cargo-about's own release build, instead of building it here,
      # checked against the checksum GitHub lists for that release asset.
      - name: Install cargo-about
        env:
          VERSION: 0.9.2
          SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
        run: |
          set -euo pipefail
          name="cargo-about-$VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Fetch the crates
        run: cargo fetch --locked

      - name: Write the licenses
        run: python3 .github/scripts/rust-licenses.py "$RUNNER_TEMP/rust-licenses"

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A push to main only installs, so that main saves the npm cache the
      # PRs start from.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # --ignore-scripts: no package runs code at install time.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        if: github.event_name != 'push'
        run: npm run lint

      - name: Typecheck
        if: github.event_name != 'push'
        run: npm run typecheck

      - name: Test
        if: github.event_name != 'push'
        run: npm test

      - name: Build
        if: github.event_name != 'push'
        run: npm run build

      # The browser the end-to-end tests drive, at the revision the locked
      # @playwright/test expects. Headless shell only: no headed Chrome.
      - name: Install Chromium for the end-to-end tests
        if: github.event_name != 'push'
        run: npx playwright install --with-deps --only-shell chromium

      # The build above under `vite preview`, with the headers open-ferry
      # sends: every screen must render without a Content-Security-Policy
      # violation. The API is mocked in the page; nothing leaves 127.0.0.1.
      - name: End-to-end
        if: github.event_name != 'push'
        run: npx playwright test

      # A failed test's trace, to replay with `npx playwright show-trace`. The
      # tests see only mocked data, so a trace holds no secrets.
      - name: Keep the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: dashboard/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Real embedded-server journeys are queue-only on PRs, like release-seams.
  # workflow_dispatch exercises them on a branch; main warms their Rust cache.
  dashboard-real:
    name: dashboard-real (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.dashboard-real == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: dashboard-real

      - name: Build the embedded dashboard
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        working-directory: dashboard
        run: npm run build

      - name: Build the real debug server with dashboard/dist
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        run: cargo build -p open-ferry --bin open-ferry --locked

      - name: Install Chromium for the real-server journeys
        if: github.event_name != 'push'
        working-directory: dashboard
        run: npx playwright install --with-deps --only-shell chromium

      - name: Real-server dashboard journeys
        if: github.event_name != 'push'
        working-directory: dashboard
        env:
          OPEN_FERRY_BIN: ${{ github.workspace }}/target/debug/open-ferry
        run: npm run e2e:real

      # No artifacts: assertion diagnostics or failure contexts can contain
      # keys or config.yaml even when trace, screenshot and video are off.
      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  # install.sh and install.ps1 against fake releases served from 127.0.0.1:
  # nothing here downloads a real release or calls GitHub, and the scripts'
  # GitHub CLI is always a fake or a name that isn't installed, though the
  # runners have gh. INSTALL_TEST_DEFAULT_PATHS also runs them without an
  # install directory or a config path, under a HOME, LOCALAPPDATA and
  # APPDATA the tests redirect to temporary directories.
  install-scripts:
    name: install-scripts (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            python: python3
            target: aarch64-apple-darwin
          # install.sh refuses Windows, so there's no target to detect; it
          # runs under Git Bash's sh with the target given, and install.ps1
          # under Windows PowerShell and PowerShell 7.
          - os: windows-latest
            python: python
            target: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      INSTALL_TEST_DEFAULT_PATHS: "1"
      INSTALL_TEST_EXPECT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the shell scripts
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --network none -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          install.sh .github/scripts/*.sh

      - name: Test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ofp-scratch"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export OFP_TEST_SCRATCH="$(cygpath -w "$GITHUB_WORKSPACE/target/ofp-scratch")"
          else
            export OFP_TEST_SCRATCH="$GITHUB_WORKSPACE/target/ofp-scratch"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            export OFP_INSTALL_TESTS_STRICT=1
          fi
          ${{ matrix.python }} -I tests/install/test_install.py -v

      # Alpine's sh and wget are BusyBox's, and its libc is musl, so this is
      # where install.sh must pick a musl build.
      - name: Test on Alpine
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          -e INSTALL_TEST_DEFAULT_PATHS=1
          -e INSTALL_TEST_EXPECT_TARGET=x86_64-unknown-linux-musl
          alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          sh -c 'apk add --no-cache python3 &&
          adduser -D installer && mkdir /work && cp -a /src/. /work/ &&
          chown -R installer:installer /work &&
          su -s /bin/sh -c "cd /work &&
          export OFP_TEST_SCRATCH=/work/target/ofp-scratch &&
          python3 -I tests/install/test_install.py -v" installer'

  # Keep the published binary unchanged: ownership of its receipt/config proves
  # the installer's primary-token owner reaches install-self and init children.
  # No Rust build, and only manual full qualification pays for real downloads.
  windows-admin-owner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install an attested release as the object-creating Administrator
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Out-Host inside the installer bypasses PowerShell stream redirection.
          # Capture the entire qualification process at the OS boundary and emit
          # only ownership/lifecycle evidence, never generated config keys.
          if ($env:OFP_OWNER_CAPTURED -ne '1') {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = Join-Path $PSHOME 'pwsh.exe'
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $info.WorkingDirectory = (Get-Location).ProviderPath
            foreach ($arg in @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $PSCommandPath)) {
              $info.ArgumentList.Add($arg)
            }
            $info.Environment['OFP_OWNER_CAPTURED'] = '1'
            $process = [Diagnostics.Process]::Start($info)
            try {
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $process.WaitForExit()
              $captured = $stdout.GetAwaiter().GetResult() + "`n" + $stderr.GetAwaiter().GetResult()
              foreach ($line in $captured.Split("`n")) {
                if ($line -match '^(Runner SID:|Installed owner |Installer restored|Service owner |Published install-self|Standalone published init|Service and machine)') {
                  Write-Host $line
                }
              }
              $global:LASTEXITCODE = $process.ExitCode
              if ($process.ExitCode -ne 0) { throw 'Windows ownership qualification failed; raw output withheld because it may contain generated keys' }
            } finally { $process.Dispose() }
            return
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($identity.User.Value -notmatch '-500$') { throw 'Expected the RID-500 hosted Administrator' }
          if (-not ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Expected an elevated runner'
          }
          # Hosted images vary in their initial token owner. Reproduce the
          # object-creator policy explicitly, without changing machine policy.
          Add-Type @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          public static class RunnerOwner {
            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool SetTokenInformation(IntPtr token, uint kind, IntPtr value, uint size);
            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(IntPtr handle);
            public static void SetOwner(string sidText) {
              var sid = new SecurityIdentifier(sidText);
              var bytes = new byte[sid.BinaryLength];
              sid.GetBinaryForm(bytes, 0);
              var pinned = GCHandle.Alloc(bytes, GCHandleType.Pinned);
              var owner = Marshal.AllocHGlobal(IntPtr.Size);
              IntPtr token = IntPtr.Zero;
              try {
                Marshal.WriteIntPtr(owner, pinned.AddrOfPinnedObject());
                if (!OpenProcessToken(new IntPtr(-1), 0x80, out token) ||
                    !SetTokenInformation(token, 4, owner, (uint)IntPtr.Size))
                  throw new Win32Exception(Marshal.GetLastWin32Error());
              } finally {
                if (token != IntPtr.Zero) CloseHandle(token);
                Marshal.FreeHGlobal(owner);
                pinned.Free();
              }
            }
          }
          '@
          [RunnerOwner]::SetOwner($identity.User.Value)
          $install = 'C:\Program Files\open-ferry'
          $data = 'C:\ProgramData\open-ferry'
          $exe = Join-Path $install 'open-ferry.exe'
          $config = Join-Path $data 'config.yaml'
          $probe = Join-Path $env:RUNNER_TEMP 'open-ferry-owner-probe'
          function Owner([string]$Path) {
            (Get-Acl -LiteralPath $Path).GetOwner([Security.Principal.SecurityIdentifier]).Value
          }
          [IO.File]::WriteAllText($probe, 'before installer')
          try {
            $before = Owner $probe
            Write-Host "Runner SID: $($identity.User.Value); default creation owner before install: $before"
            if ($before -ne $identity.User.Value) { throw 'Runner does not reproduce object-creator ownership' }
          } finally { Remove-Item -LiteralPath $probe -Force }
          if ((Test-Path -LiteralPath $install) -or (Test-Path -LiteralPath $data)) {
            throw 'Expected fresh machine install directories'
          }
          try {
            # Call the real function with an invalid version: it fails after
            # owner setup but before downloads or directory creation. This also
            # models the caller-owned session used by irm | iex.
            $tokens = $null; $errors = $null
            $ast = [Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw 'Installer did not parse' }
            $function = $ast.Find({ param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Install-OpenFerry'
            }, $true)
            . ([scriptblock]::Create($function.Extent.Text))
            try {
              Install-OpenFerry -System $true -NoMigrate $true -Version 'invalid' -InstallDir $install -ConfigPath $config
              throw 'Expected installer version rejection'
            } catch {
              if ($_.Exception.Message -notlike 'Not a version:*') { throw 'Unexpected failed-install probe result' }
            }
            [IO.File]::WriteAllText($probe, 'after failed installer')
            try {
              if ((Owner $probe) -ne $identity.User.Value) { throw 'Failed installer did not restore the caller default owner' }
              Write-Host 'Installer restored the caller object-creator default owner after failure.'
            } finally { Remove-Item -LiteralPath $probe -Force }
            # Capture init's generated keys; never print or upload its output.
            $output = & .\install.ps1 -System -NoMigrate -Version 0.0.2 -InstallDir $install -ConfigPath $config *>&1
            if ($LASTEXITCODE -ne 0) { throw "Installer failed: $($output | Select-String 'install.ps1: error:')" }
            if (-not ($output | Select-String -SimpleMatch 'Checking the build provenance attestation with gh')) {
              throw 'The real attestation check did not run'
            }
            foreach ($path in @($install, $exe, $data, (Join-Path $data 'install-receipt.json'), $config)) {
              $owner = Owner $path
              Write-Host "Installed owner $owner : $path"
              if ($owner -ne 'S-1-5-32-544') { throw "Unexpected owner of $path" }
            }
            Write-Host 'Published install-self and init inherited the Administrators default owner.'
            [IO.File]::WriteAllText($probe, 'after installer')
            try {
              if ((Owner $probe) -ne $identity.User.Value) { throw 'Installer did not restore the caller default owner' }
              Write-Host 'Installer restored the caller object-creator default owner.'
            } finally { Remove-Item -LiteralPath $probe -Force }
            # The pinned old binary has no startup hook. Normalize this separate
            # service invocation explicitly after checking installer restoration.
            [RunnerOwner]::SetOwner('S-1-5-32-544')
            $output = & $exe service install -system -config $config 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Service install failed: $output" }
            & $exe service status -system
            if ($LASTEXITCODE -ne 0) { throw 'Service status failed' }
            foreach ($root in @($install, $data)) {
              foreach ($entry in @(Get-Item -LiteralPath $root) + @(Get-ChildItem -LiteralPath $root -Recurse -Force)) {
                $owner = Owner $entry.FullName
                Write-Host "Service owner $owner : $($entry.FullName)"
                # The service itself runs as SYSTEM and creates its own runtime files.
                if ($owner -notin 'S-1-5-32-544', 'S-1-5-18') { throw "Unexpected owner of $($entry.FullName)" }
              }
            }
            # A later invocation of the old release has no Rust startup fix.
            # Restore the original default to model a fresh elevated terminal.
            $legacyConfig = Join-Path $data 'old-owner-probe.yaml'
            try {
              [RunnerOwner]::SetOwner($identity.User.Value)
              $output = & $exe init -system -config $legacyConfig *>&1
              if ($LASTEXITCODE -ne 0) { throw 'Standalone published init probe failed' }
              $owner = Owner $legacyConfig
              Write-Host "Standalone published init with object-creator token made owner $owner"
              if ($owner -ne $identity.User.Value) { throw 'Expected old binary to retain the account default owner' }
            } finally {
              [RunnerOwner]::SetOwner('S-1-5-32-544')
              foreach ($path in @($legacyConfig, "$legacyConfig.lock", "$legacyConfig.sha256", "$legacyConfig.bak")) {
                if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
              }
            }
          } finally {
            $uninstallFailed = $false
            if (Get-Service -Name open-ferry -ErrorAction SilentlyContinue) {
              try {
                & $exe service uninstall -system
                $uninstallFailed = $LASTEXITCODE -ne 0
              } catch { $uninstallFailed = $true }
            }
            $serviceRemains = $null -ne (Get-Service -Name open-ferry -ErrorAction SilentlyContinue)
            foreach ($root in @($install, $data)) {
              if ([IO.Path]::GetFullPath($root) -notin 'C:\Program Files\open-ferry', 'C:\ProgramData\open-ferry') {
                throw 'Unexpected cleanup target'
              }
              if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
              if (Test-Path -LiteralPath $root) { throw "Cleanup left $root" }
            }
            if ($uninstallFailed) { throw 'Service uninstall failed' }
            if ($serviceRemains) { throw 'Service registration remains' }
            Write-Host 'Service and machine install directories removed.'
          }

  install-scripts-root:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OFP_INSTALL_TESTS_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test real root without network
        run: |
          mkdir -p "$RUNNER_TEMP/ofp-scratch"
          chmod 755 "$RUNNER_TEMP/ofp-scratch"
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/ofp-scratch:/scratch" -e OFP_TEST_SCRATCH=/scratch \
            -e OFP_INSTALL_TESTS_STRICT \
            python:3.12-bookworm python -I /src/tests/install/test_root_install.py -v
