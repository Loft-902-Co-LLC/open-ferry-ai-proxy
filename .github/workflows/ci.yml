name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks again on each PR as it would land.
  merge_group:
  # Every check, as the merge queue runs them, on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

# What runs when:
# - A PR runs the tests, clippy, the docs, the licenses, the dashboard and the
#   install scripts. The release builds and the blue-green tests, the slowest,
#   are left to the merge queue; skipped, they count as passed on the PR.
# - The merge queue and workflow_dispatch run everything.
# - A push to main, which is a PR that landed, runs no tests. It builds what
#   the Rust caches hold when main's caches don't have it yet, and saves them.
# - When only files under dashboard/ changed, the Rust jobs are skipped.
# The checks the ruleset requires keep their names. check and blue-green sum
# up the jobs that do the work, per OS.

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A PR's merge commit is compared with its first parent, the base
      # branch; a merge group with the queue's base; a push with the commit
      # before it. Anything else, or a comparison that fails, counts as a
      # Rust change. So does a file outside dashboard/ (docs/agents.md is
      # built into open-ferry), and a dashboard file a Rust test reads, which
      # crates/ names.
      - name: Whether Rust builds or reads anything that changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$(git rev-parse --verify --quiet 'HEAD^1' || true) ;;
            merge_group) base=$GROUP_BASE ;;
            push) base=$PUSH_BASE ;;
            *) base= ;;
          esac
          rust=true
          if [[ -n $base && $base != 0000000000000000000000000000000000000000 ]] &&
            git fetch --quiet --no-tags --depth=1 origin "$base" &&
            git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed" &&
            [[ -s $RUNNER_TEMP/changed ]]; then
            rust=false
            while IFS= read -r path; do
              if [[ $path != dashboard/* ]] || git grep --quiet --fixed-strings -e "$path" -- crates; then
                echo "Rust change: $path"
                rust=true
                break
              fi
            done < "$RUNNER_TEMP/changed"
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # Format, clippy, the tests and the docs. The Windows job runs the same
  # steps.
  tests-ubuntu:
    name: tests (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps: &tests-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: tests

      - name: Format
        if: github.event_name != 'push'
        run: cargo fmt --all --check

      - name: Clippy
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A push to main fills the cache: it builds what the tests need and
      # runs none.
      - name: Build the tests
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked --no-run

      - name: Test
        if: github.event_name != 'push'
        run: cargo test --workspace --locked --no-fail-fast

      - name: Docs
        if: github.event_name != 'push'
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  tests-windows:
    name: tests (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    steps: *tests-steps

  # What the release workflow ships carries none of the blue-green test
  # seams (see blue-green-tests): build it as it ships (the feature off) and
  # scan it for their strings.
  release-seams-ubuntu:
    name: release-seams (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &release-seams-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: release

      - name: Release builds hold no test seams
        if: github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p open-ferry-supervisor --lib --no-default-features --message-format=json > "$RUNNER_TEMP/supervisor-build.json"
          "$PYTHON" -I crates/open-ferry-supervisor/check-release.py "$RUNNER_TEMP/supervisor-build.json"
          cargo build --release --locked -p open-ferry --bin open-ferry --no-default-features --message-format=json > "$RUNNER_TEMP/open-ferry-build.json"
          "$PYTHON" -I crates/open-ferry/check-release.py "$RUNNER_TEMP/open-ferry-build.json"
          cargo build --release --locked -p open-ferry-update --example release-seam-check --no-default-features
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          "$PYTHON" -I crates/open-ferry-update/tests/check_release_seams.py "target/release/examples/release-seam-check$suffix"

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  release-seams-windows:
    name: release-seams (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps: *release-seams-steps

  # The same builds with the feature on, scanned with each checker's
  # --self-test: there the scans must find the seams, so a scan can't pass by
  # finding nothing. A job of its own, so that the two halves build side by
  # side. The feature changes none of the dependencies, so it shares
  # release-seams' cache and leaves saving it to that job: a push builds
  # nothing here.
  release-seams-feature-ubuntu:
    name: release-seams-feature (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &release-seams-feature-steps
      - if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event_name != 'push'
        uses: ./.github/actions/setup-rust
        with:
          cache: release

      - name: Feature builds hold the test seams
        if: github.event_name != 'push'
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          set -euo pipefail
          "$PYTHON" -I -m unittest discover -s crates/open-ferry -p test_check_release.py
          "$PYTHON" -I -m unittest discover -s crates/open-ferry-supervisor -p test_check_release.py
          cargo build --release --locked -p open-ferry-update --example release-seam-check --no-default-features --features blue-green-test
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          "$PYTHON" -I crates/open-ferry-update/tests/check_release_seams.py --self-test "target/release/examples/release-seam-check$suffix"
          cargo build --release --locked -p open-ferry-supervisor --lib --no-default-features --features blue-green-test --message-format=json > "$RUNNER_TEMP/supervisor-feature-build.json"
          "$PYTHON" -I crates/open-ferry-supervisor/check-release.py --self-test "$RUNNER_TEMP/supervisor-feature-build.json"
          cargo build --release --locked -p open-ferry --bin open-ferry --no-default-features --features blue-green-test --message-format=json > "$RUNNER_TEMP/open-ferry-feature-build.json"
          "$PYTHON" -I crates/open-ferry/check-release.py --self-test "$RUNNER_TEMP/open-ferry-feature-build.json"

  release-seams-feature-windows:
    name: release-seams-feature (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps: *release-seams-feature-steps

  # The blue-green switch's test seams (worker faults, barriers, the
  # supervisor's isolation flags) are compiled only with this feature. The
  # supervisor's process tests run on it: against its fake worker, and
  # open-ferry's against the real one. Each process runs with the environment
  # cleaned, on its own data directory and endpoint, and its update checks go
  # to a closed loopback port. They take longer than everything else, so three
  # runners per OS share them; blue-green-shard.py picks each one's targets.
  blue-green-tests-ubuntu:
    name: blue-green (ubuntu-latest, ${{ matrix.shard }} of 3)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    strategy: &blue-green-shards
      fail-fast: false
      matrix:
        # A push to main only fills the cache, which one runner does.
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1, 2, 3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &blue-green-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own cache: the feature changes what these crates build.
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache: blue-green

      # Pinned release assets, checked before extraction; no install action or
      # unverified fallback (the repository allows GitHub-owned actions only).
      - name: Install cargo-nextest
        shell: bash
        env:
          VERSION: 0.9.146
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              target=x86_64-unknown-linux-musl
              sha256=b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa
              temp="$RUNNER_TEMP"
              ;;
            Windows)
              target=x86_64-pc-windows-msvc
              sha256=809b01f2c94d031ab6cf5f4d4a4f477c8f51b69c96ab3cb2fe4db7ecb222d0d3
              temp=$(cygpath -u "$RUNNER_TEMP")
              ;;
            *) echo "unsupported nextest platform: $RUNNER_OS" >&2; exit 1 ;;
          esac
          name="cargo-nextest-$VERSION-$target.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$temp/$name" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/$name"
          echo "$sha256  $temp/$name" | sha256sum --check --strict
          mkdir "$temp/nextest-$VERSION"
          tar -xzf "$temp/$name" -C "$temp/nextest-$VERSION"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$temp/nextest-$VERSION" >> "$GITHUB_PATH"
          else
            echo "$temp/nextest-$VERSION" >> "$GITHUB_PATH"
          fi

      - name: Clippy with the blue-green test seams
        if: matrix.shard == 1 && (github.event_name != 'push' || steps.rust.outputs.cache-hit != 'true')
        run: cargo clippy -p open-ferry -p open-ferry-supervisor -p open-ferry-update --all-targets --locked --features blue-green-test -- -D warnings

      - name: Build the tests
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        run: cargo nextest run --profile ci -p open-ferry -p open-ferry-supervisor -p open-ferry-update --locked --features blue-green-test --no-run

      - name: This runner's share of the tests
        id: shard
        if: github.event_name != 'push'
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          "$PYTHON" -I .github/scripts/blue-green-shard.py "$RUNNER_TEMP/metadata.json" "$RUNNER_OS" "$SHARD" 3 >> "$GITHUB_OUTPUT"

      # The script passes on plain target names only, so its output can go
      # into the command line.
      - name: Test with the blue-green test seams
        if: github.event_name != 'push'
        run: cargo nextest run --profile ci -p open-ferry -p open-ferry-supervisor -p open-ferry-update --locked --features blue-green-test ${{ steps.shard.outputs.args }}

      - name: Doc tests with the blue-green test seams
        if: github.event_name != 'push' && steps.shard.outputs.doc == 'true'
        run: cargo test -p open-ferry -p open-ferry-supervisor -p open-ferry-update --locked --features blue-green-test --doc

      - name: Save the cache
        if: github.event_name == 'push' && steps.rust.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.rust.outputs.key }}

  blue-green-tests-windows:
    name: blue-green (windows-latest, ${{ matrix.shard }} of 3)
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    strategy: *blue-green-shards
    runs-on: windows-latest
    timeout-minutes: 60
    steps: *blue-green-steps

  # The required checks check and blue-green, one per OS: each passes when that
  # OS's jobs passed, or were skipped as the run's event allows (see the top).
  # They run unless the run was cancelled, so that a job that failed, or was
  # skipped because one it needs failed, fails them instead of their being
  # skipped, which would count as passed. Their matrix gives them the names the
  # ruleset requires; a skipped matrix job reports none of them, so a cancelled
  # run passes nothing.
  check:
    name: check (${{ matrix.os }})
    needs: [changes, tests-ubuntu, tests-windows, release-seams-ubuntu, release-seams-windows, release-seams-feature-ubuntu, release-seams-feature-windows]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jobs: tests-ubuntu release-seams-ubuntu release-seams-feature-ubuntu
            queue-only: release-seams-ubuntu release-seams-feature-ubuntu
          - os: windows-latest
            jobs: tests-windows release-seams-windows release-seams-feature-windows
            queue-only: release-seams-windows release-seams-feature-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: &results-steps
      - name: Results
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOBS: changes ${{ matrix.jobs }}
          QUEUE_ONLY: ${{ matrix.queue-only }}
          RUST: ${{ needs.changes.outputs.rust }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed=0
          for job in $JOBS; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            echo "$job: $result"
            case $result in
              success) continue ;;
              # Skipped as planned: nothing Rust changed, or a PR leaves the
              # job to the merge queue.
              skipped)
                if [[ $job != changes && $RUST == false ]]; then continue; fi
                if [[ $EVENT == pull_request && " $QUEUE_ONLY " == *" $job "* ]]; then continue; fi
                ;;
            esac
            echo "::error::$job: $result"
            failed=1
          done
          exit "$failed"

  blue-green:
    name: blue-green (${{ matrix.os }})
    needs: [changes, blue-green-tests-ubuntu, blue-green-tests-windows]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jobs: blue-green-tests-ubuntu
            queue-only: blue-green-tests-ubuntu
          - os: windows-latest
            jobs: blue-green-tests-windows
            queue-only: blue-green-tests-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *results-steps

  # What the release workflow's rust-licenses job does, so that a new crate
  # under a license about.toml doesn't accept fails here, not at release time.
  rust-licenses:
    name: rust-licenses
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal

      # cargo-about's own release build, instead of building it here,
      # checked against the checksum GitHub lists for that release asset.
      - name: Install cargo-about
        env:
          VERSION: 0.9.2
          SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
        run: |
          set -euo pipefail
          name="cargo-about-$VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Fetch the crates
        run: cargo fetch --locked

      - name: Write the licenses
        run: python3 .github/scripts/rust-licenses.py "$RUNNER_TEMP/rust-licenses"

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A push to main only installs, so that main saves the npm cache the
      # PRs start from.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # --ignore-scripts: no package runs code at install time.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        if: github.event_name != 'push'
        run: npm run lint

      - name: Typecheck
        if: github.event_name != 'push'
        run: npm run typecheck

      - name: Test
        if: github.event_name != 'push'
        run: npm test

      - name: Build
        if: github.event_name != 'push'
        run: npm run build

      # The browser the end-to-end tests drive, at the revision the locked
      # @playwright/test expects. Headless shell only: no headed Chrome.
      - name: Install Chromium for the end-to-end tests
        if: github.event_name != 'push'
        run: npx playwright install --with-deps --only-shell chromium

      # The build above under `vite preview`, with the headers open-ferry
      # sends: every screen must render without a Content-Security-Policy
      # violation. The API is mocked in the page; nothing leaves 127.0.0.1.
      - name: End-to-end
        if: github.event_name != 'push'
        run: npx playwright test

      # A failed test's trace, to replay with `npx playwright show-trace`. The
      # tests see only mocked data, so a trace holds no secrets.
      - name: Keep the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: dashboard/test-results
          retention-days: 7
          if-no-files-found: ignore

  # install.sh and install.ps1 against fake releases served from 127.0.0.1:
  # nothing here downloads a real release or calls GitHub, and the scripts'
  # GitHub CLI is always a fake or a name that isn't installed, though the
  # runners have gh. INSTALL_TEST_DEFAULT_PATHS also runs them without an
  # install directory or a config path, under a HOME, LOCALAPPDATA and
  # APPDATA the tests redirect to temporary directories.
  install-scripts:
    name: install-scripts (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            python: python3
            target: aarch64-apple-darwin
          # install.sh refuses Windows, so there's no target to detect; it
          # runs under Git Bash's sh with the target given, and install.ps1
          # under Windows PowerShell and PowerShell 7.
          - os: windows-latest
            python: python
            target: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      INSTALL_TEST_DEFAULT_PATHS: "1"
      INSTALL_TEST_EXPECT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the shell scripts
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --network none -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          install.sh .github/scripts/*.sh

      - name: Test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/ofp-scratch"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export OFP_TEST_SCRATCH="$(cygpath -w "$GITHUB_WORKSPACE/target/ofp-scratch")"
          else
            export OFP_TEST_SCRATCH="$GITHUB_WORKSPACE/target/ofp-scratch"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            export OFP_INSTALL_TESTS_STRICT=1
          fi
          ${{ matrix.python }} -I tests/install/test_install.py -v

      # Alpine's sh and wget are BusyBox's, and its libc is musl, so this is
      # where install.sh must pick a musl build.
      - name: Test on Alpine
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          -e INSTALL_TEST_DEFAULT_PATHS=1
          -e INSTALL_TEST_EXPECT_TARGET=x86_64-unknown-linux-musl
          alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          sh -c 'apk add --no-cache python3 &&
          adduser -D installer && mkdir /work && cp -a /src/. /work/ &&
          chown -R installer:installer /work &&
          su -s /bin/sh -c "cd /work &&
          export OFP_TEST_SCRATCH=/work/target/ofp-scratch &&
          python3 -I tests/install/test_install.py -v" installer'

  install-scripts-root:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OFP_INSTALL_TESTS_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test real root without network
        run: |
          mkdir -p "$RUNNER_TEMP/ofp-scratch"
          chmod 755 "$RUNNER_TEMP/ofp-scratch"
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/ofp-scratch:/scratch" -e OFP_TEST_SCRATCH=/scratch \
            -e OFP_INSTALL_TESTS_STRICT \
            python:3.12-bookworm python -I /src/tests/install/test_root_install.py -v
