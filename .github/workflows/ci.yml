name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks again on each PR as it would land.
  merge_group:
  # Every check, as the merge queue runs them, on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

# What runs when:
# - A PR runs parity, the tests, clippy, the docs, the licenses, the dashboard and the
#   install scripts. The release builds and the blue-green tests, the slowest,
#   are left to the merge queue; skipped, they count as passed on the PR.
# - The merge queue and workflow_dispatch run everything.
# - A push to main, which is a PR that landed, runs no tests. It builds what
#   the Rust caches hold when main's caches don't have it yet, and saves them.
# - When only files under dashboard/ changed, the Rust jobs are skipped;
#   dashboard-real still builds the binary with those embedded assets.
# The checks the ruleset requires keep their names. check and blue-green sum
# up the jobs that do the work, per OS.

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
                if [[ $job == parity ]]; then
                  if [[ $PARITY == false ]]; then continue; fi
                elif [[ $job != changes && $RUST == false ]]; then continue; fi
