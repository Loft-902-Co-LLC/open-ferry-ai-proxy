name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks again on each PR as it would land.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Docs
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # What the release workflow's rust-licenses job does, so that a new crate
  # under a license about.toml doesn't accept fails here, not at release time.
  rust-licenses:
    name: rust-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Fetch the crates
        run: cargo fetch --locked

      - name: Write the licenses
        run: python3 .github/scripts/rust-licenses.py "$RUNNER_TEMP/rust-licenses"

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # --ignore-scripts: no package runs code at install time.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The browser the end-to-end tests drive, at the revision the locked
      # @playwright/test expects. Headless shell only: no headed Chrome.
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps --only-shell chromium

      # The build above under `vite preview`, with the headers open-ferry
      # sends: every screen must render without a Content-Security-Policy
      # violation. The API is mocked in the page; nothing leaves 127.0.0.1.
      - name: End-to-end
        run: npx playwright test

      # A failed test's trace, to replay with `npx playwright show-trace`. The
      # tests see only mocked data, so a trace holds no secrets.
      - name: Keep the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: dashboard/test-results
          retention-days: 7
          if-no-files-found: ignore

  # install.sh and install.ps1 against fake releases served from 127.0.0.1:
  # nothing here downloads a real release or calls GitHub, and the scripts'
  # GitHub CLI is always a fake or a name that isn't installed, though the
  # runners have gh. INSTALL_TEST_DEFAULT_PATHS also runs them without an
  # install directory or a config path, under a HOME, LOCALAPPDATA and
  # APPDATA the tests redirect to temporary directories.
  install-scripts:
    name: install-scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            python: python3
            target: aarch64-apple-darwin
          # install.sh refuses Windows, so there's no target to detect; it
          # runs under Git Bash's sh with the target given, and install.ps1
          # under Windows PowerShell and PowerShell 7.
          - os: windows-latest
            python: python
            target: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      INSTALL_TEST_DEFAULT_PATHS: "1"
      INSTALL_TEST_EXPECT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the shell scripts
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --network none -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          install.sh .github/scripts/*.sh

      - name: Test
        run: ${{ matrix.python }} tests/install/test_install.py -v

      # Alpine's sh and wget are BusyBox's, and its libc is musl, so this is
      # where install.sh must pick a musl build.
      - name: Test on Alpine
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          -e INSTALL_TEST_DEFAULT_PATHS=1
          -e INSTALL_TEST_EXPECT_TARGET=x86_64-unknown-linux-musl
          alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          sh -c 'apk add --no-cache python3 && python3 tests/install/test_install.py -v'
