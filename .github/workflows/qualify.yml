name: Qualify two candidate builds

on:
  workflow_call:
    inputs:
      fault:
        type: string
        default: none
        description: 'Qualification control: none, untrusted-key or bad-signature'
      preflight_only:
        type: boolean
        default: false
        description: 'Only probe the Windows standard-account interactive task'

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ inputs.preflight_only && 'preflight' || 'qualify' }} (${{ matrix.os }}, user)
    strategy:
      fail-fast: false
      matrix:
        # Hosted Windows has only an elevated console user. A genuine standard
        # account's InteractiveToken task is refused (Task Scheduler event 332).
        # Keep its explicit prerequisite probe; never count it as qualification.
        os: ${{ fromJSON(inputs.preflight_only && '["windows-2025"]' || '["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      OPEN_FERRY_REQUIRE_DASHBOARD: '1'
      # Windows desktop lifecycle runs locally; hosted Windows has no limited interactive logon.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      COPYFILE_DISABLE: '1'
      QUALIFY_FAULT: ${{ inputs.fault }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: State hosted qualification coverage
        if: ${{ !inputs.preflight_only }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Qualifies real Linux systemd user and macOS GUI LaunchAgent services.
          Hosted Windows user qualification remains blocked: its console is elevated,
          and a standard account's InteractiveToken task is refused (scheduler event 332).
          Machine installers cannot use the throwaway loopback mirror.
          See RELEASING.md for desktop qualification and the remaining release gates.
          EOF

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Probe the real Windows standard account and interactive task
        if: inputs.preflight_only && runner.os == 'Windows'
        shell: pwsh
        run: |
          & .github/scripts/qualify/windows-user.ps1 -ProbeOnly -Python (Get-Command python).Source -Work (Join-Path $env:RUNNER_TEMP 'open-ferry-user-preflight')

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.preflight_only }}
        with:
          name: dashboard-dist
          path: dashboard/dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.preflight_only }}
        with:
          name: rust-licenses
          path: rust-licenses

      - name: Prepare native builds
        if: ${{ !inputs.preflight_only }}
        run: |
          rustup toolchain install --profile minimal
          python -I -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/scripts/qualify/requirements.txt

      - name: Check qualification failure controls
        if: ${{ !inputs.preflight_only }}
        run: python -I .github/scripts/qualify/test_run.py

      - name: Build and package A and B with one throwaway key
        if: ${{ !inputs.preflight_only }}
        run: python -I .github/scripts/qualify/build.py "$RUNNER_TEMP/open-ferry-qualification"

      - name: Verify candidate build inputs were restored
        if: ${{ always() && !inputs.preflight_only }}
        run: git diff --exit-code -- Cargo.toml Cargo.lock release-keys.pub

      - name: Qualify the user service
        if: ${{ !inputs.preflight_only }}
        run: python -I .github/scripts/qualify/run.py "$RUNNER_TEMP/open-ferry-qualification"

      # Explicit allowlist: never the mirror, checkout, init output, config or keys.
      - name: Keep qualification evidence (also on failure)
        if: always() && !inputs.preflight_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.os }}-user
          path: ${{ runner.temp }}/open-ferry-qualification/diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Keep Windows prerequisite evidence
        if: always() && inputs.preflight_only && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-windows-2025-user-preflight
          path: ${{ runner.temp }}/open-ferry-user-preflight/diagnostics
          if-no-files-found: warn
          retention-days: 7
