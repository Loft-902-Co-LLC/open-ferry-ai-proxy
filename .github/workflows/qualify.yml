name: Qualify two candidate builds

on:
  workflow_call:
    inputs:
      fault:
        type: string
        default: none
        description: 'Qualification control: none or bad-signature'
      preflight_only:
        type: boolean
        default: false
        description: 'Only probe the Windows standard-account interactive task'

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ inputs.preflight_only && 'preflight' || 'qualify' }} (${{ matrix.os }}, user)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.preflight_only && '["windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      OPEN_FERRY_REQUIRE_DASHBOARD: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      COPYFILE_DISABLE: '1'
      QUALIFY_FAULT: ${{ inputs.fault }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Probe the real Windows standard account and interactive task
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .github/scripts/qualify/windows-user.ps1 -ProbeOnly -Python (Get-Command python).Source -Work (Join-Path $env:RUNNER_TEMP 'open-ferry-user-preflight')

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.preflight_only }}
        with:
          name: dashboard-dist
          path: dashboard/dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.preflight_only }}
        with:
          name: rust-licenses
          path: rust-licenses

      - name: Prepare native builds
        if: ${{ !inputs.preflight_only }}
        run: |
          rustup toolchain install --profile minimal
          python -I -m pip install --disable-pip-version-check cryptography==46.0.3 PyYAML==6.0.3

      - name: Build and package A and B with one throwaway key
        if: ${{ !inputs.preflight_only }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export QUALIFY_BASH
            QUALIFY_BASH=$(cygpath -w "$BASH")
          fi
          python -I .github/scripts/qualify/build.py "$RUNNER_TEMP/open-ferry-qualification"

      - name: Qualify the user service
        if: runner.os != 'Windows' && !inputs.preflight_only
        run: python -I .github/scripts/qualify/run.py "$RUNNER_TEMP/open-ferry-qualification"

      - name: Qualify the unelevated Windows user task
        if: runner.os == 'Windows' && !inputs.preflight_only
        shell: pwsh
        run: |
          & .github/scripts/qualify/windows-user.ps1 -Python (Get-Command python).Source -Work (Join-Path $env:RUNNER_TEMP 'open-ferry-qualification')

      # Explicit allowlist: never the mirror, checkout, init output, config or keys.
      - name: Keep qualification evidence (also on failure)
        if: always() && !inputs.preflight_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.os }}-user
          path: ${{ runner.temp }}/open-ferry-qualification/diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Keep Windows prerequisite evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-windows-latest-user-preflight
          path: ${{ runner.temp }}/open-ferry-user-preflight/diagnostics
          if-no-files-found: warn
          retention-days: 7
