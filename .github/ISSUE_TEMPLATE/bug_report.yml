name: Bug report
description: Something in open-ferry doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Remove every API key, token and account ID** from what you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The request or client you used, and the relevant part of your config with secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets removed.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. a commit hash from main
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does CLIProxyAPI behave the same way?
      options: ["Don't know", "Yes, upstream does the same", "No, upstream works"]
