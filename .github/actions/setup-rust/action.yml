name: Set up Rust
description: >-
  Installs the toolchain rust-toolchain.toml names, restores the dependency
  cache, and on Windows makes the scratch and temp directories the trust
  checks accept. Run it after actions/checkout.

inputs:
  cache:
    description: >-
      The cache's name. Jobs that build the same way share one, so each way is
      cached once.
    required: true

outputs:
  cache-hit:
    description: Whether the cache held this exact key.
    value: ${{ steps.lookup.outputs.cache-hit || steps.cache.outputs.cache-hit }}
  key:
    description: The cache's key, for save-rust-cache.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Install the toolchain from rust-toolchain.toml
      shell: bash
      run: rustup toolchain install --profile minimal

    # What the dependencies' builds depend on: the toolchain, the lock file
    # and the manifests, which pick the features. The workflow's CARGO*
    # variables count too: bump v1 when they change.
    - id: key
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        hash=$(git ls-files -z -- rust-toolchain.toml Cargo.lock ':(glob)**/Cargo.toml' | xargs -0 cat | sha256sum | cut -c1-16)
        echo "key=cargo-v1-$CACHE-$RUNNER_OS-$hash" >> "$GITHUB_OUTPUT"
        echo "prefix=cargo-v1-$CACHE-$RUNNER_OS-" >> "$GITHUB_OUTPUT"

    # Only a push to main saves (see save-rust-cache), so the caches are
    # main's: PR and merge-queue runs don't push them out of the
    # repository's space. A push only looks its key up. When main has it,
    # there is nothing to build; when not, it builds from nothing, so that
    # builds of old dependencies don't pile up in the cache.
    - id: lookup
      if: github.event_name == 'push'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The same paths as save-rust-cache's.
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ steps.key.outputs.key }}
        lookup-only: true

    # Everything else starts from main's cache for this key, or the newest
    # one with the same name.
    - id: cache
      if: github.event_name != 'push'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # The supervisor's tests run binaries from scratch directories, which
    # its trust check must accept. The runner's D: drive, where the
    # checkout and the target directory are, is owned by NETWORK SERVICE,
    # which the check refuses. The runner is also elevated, so open-ferry
    # runs privileged in the tests and refuses config and auth paths that
    # anyone but administrators and SYSTEM can write, as the runner's
    # profile and its temp directory are. So the scratch and temp
    # directories go under a directory on C: that only administrators and
    # SYSTEM own and can write.
    - name: Scratch directory for the trust checks
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $root = 'C:\ofp-ci'
        New-Item -ItemType Directory -Force -Path $root | Out-Null
        icacls $root /setowner '*S-1-5-32-544' /q
        if ($LASTEXITCODE -ne 0) { exit 1 }
        icacls $root /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' /q
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $scratch = Join-Path $root 'scratch'
        $temp = Join-Path $root 'temp'
        New-Item -ItemType Directory -Force -Path $scratch, $temp | Out-Null
        $probe = New-Item -ItemType File -Force -Path (Join-Path $temp 'owner-probe')
        "New files here are owned by $((Get-Acl $probe.FullName).Owner)"
        Remove-Item $probe.FullName
        "OFP_TEST_SCRATCH=$scratch" >> $env:GITHUB_ENV
        "TMP=$temp" >> $env:GITHUB_ENV
        "TEMP=$temp" >> $env:GITHUB_ENV
