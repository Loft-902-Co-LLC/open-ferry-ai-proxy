[package]
name = "open-ferry-update"
description = "Finding, checking and staging signed open-ferry releases"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
minisign-verify = "0.3.0"
open-ferry-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros", "process"] }
tracing = "0.1.44"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
axum = "0.8.9"
minisign = "0.10.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
