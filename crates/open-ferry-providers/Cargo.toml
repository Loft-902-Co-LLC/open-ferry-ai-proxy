[package]
name = "open-ferry-providers"
description = "Provider executors and OAuth logins for open-ferry-ai-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
http = "1.5.0"
open-ferry-core.workspace = true
open-ferry-translate.workspace = true
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros", "net"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
