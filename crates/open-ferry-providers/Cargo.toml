[package]
name = "open-ferry-providers"
description = "Provider executors and OAuth logins for open-ferry-ai-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = "1.18.1"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", features = ["sink"] }
http = "1.5.0"
httparse = "1.10.1"
open-ferry-core.workspace = true
open-ferry-translate.workspace = true
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
socket2 = "0.6.5"
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
