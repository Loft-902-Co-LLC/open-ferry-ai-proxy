[package]
name = "open-ferry"
description = "A Rust port of CLIProxyAPI with a built-in UI and first-class WebSocket support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "open-ferry"
path = "src/main.rs"

[features]
# The blue-green switch's test seams: worker faults and named barriers.
# Off in release builds, which must contain none of their strings.
blue-green-test = [
    "open-ferry-core/blue-green-test",
    "open-ferry-supervisor/blue-green-test",
    "open-ferry-update/blue-green-test",
]

[dependencies]
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hyper = { version = "1.11.1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server-auto"] }
open-ferry-core.workspace = true
open-ferry-dashboard.workspace = true
open-ferry-management.workspace = true
open-ferry-providers.workspace = true
open-ferry-server.workspace = true
open-ferry-supervisor.workspace = true
open-ferry-translate.workspace = true
open-ferry-tui.workspace = true
open-ferry-update.workspace = true
rand = "0.10.3"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
socket2 = "0.6.5"
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "registry"] }

[target.'cfg(unix)'.dependencies]
# Already in the lock file (core, management, supervisor and update use it):
# the supervised worker's no-op SIGINT and SIGTERM handlers.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
open-ferry-tui = { workspace = true, features = ["test-support"] }
futures-util = { version = "0.3.34", features = ["sink"] }
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1", "http2", "server"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tokio-tungstenite = "0.30.0"
