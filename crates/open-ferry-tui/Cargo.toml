[package]
name = "open-ferry-tui"
description = "Terminal management UI for open-ferry-ai-proxy, a ratatui port of CLIProxyAPI's TUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
open-ferry-translate.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset"] }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
