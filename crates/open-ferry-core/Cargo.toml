[package]
name = "open-ferry-core"
description = "Config, accounts, credential store and routing for open-ferry-ai-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1.1.5"
base64 = "0.23.1"
brotli-decompressor = "6.0.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
futures-core = "0.3.31"
futures-util = "0.3.34"
http = "1.3.1"
notify = "8.2.0"
open-ferry-translate.workspace = true
rand = "0.10.3"
regex = "1.13.1"
ruzstd = "0.9.0"
saphyr-parser = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
