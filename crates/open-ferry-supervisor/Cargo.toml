[package]
name = "open-ferry-supervisor"
description = "Local process and socket plumbing for open-ferry's supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
blue-green-test = ["open-ferry-update/blue-green-test"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
open-ferry-update.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory"] }

[[bin]]
name = "fake_worker"
path = "src/bin/fake_worker.rs"
required-features = ["blue-green-test"]

[dev-dependencies]
socket2 = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }

[[test]]
name = "startup"
required-features = ["blue-green-test"]

[[test]]
name = "supervise"
required-features = ["blue-green-test"]
