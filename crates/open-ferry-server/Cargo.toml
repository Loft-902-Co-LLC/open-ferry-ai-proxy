[package]
name = "open-ferry-server"
description = "HTTP and WebSocket handlers for open-ferry-ai-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
flate2 = "1.1.10"
futures-util = "0.3.34"
http = "1.5.0"
open-ferry-core.workspace = true
open-ferry-translate.workspace = true
regex = "1.13.1"
serde_json.workspace = true
ruzstd = "0.9.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
