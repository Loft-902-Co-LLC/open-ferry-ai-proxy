[package]
name = "open-ferry-management"
description = "CLIProxyAPI-compatible management API for open-ferry-ai-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
http = "1.5.0"
open-ferry-core.workspace = true
open-ferry-providers.workspace = true
open-ferry-translate.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset"] }
serde = "1.0.229"
serde_json.workspace = true
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros", "io-util", "net"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
aws-lc-rs = "1.18.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
