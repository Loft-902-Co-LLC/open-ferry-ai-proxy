nextest-version = { required = "0.9.146" }

# Not upstream's: process-per-test isolation for the blue-green supervisor tests.
# Plain cargo test retains the shared-process descriptor/fork gates.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups.process-unix]
max-threads = 2

[test-groups.process-windows]
max-threads = 4

[[profile.ci.overrides]]
platform = 'cfg(unix)'
filter = 'binary(/^process_/) | binary(=startup) | binary(=supervise) | binary(=fake_worker) | binary(=worker_channel) | binary(=unix_process) | binary(=windows_process) | binary(=windows_sockets) | binary(=endpoint) | binary(=migrate) | binary(=subcommands)'
test-group = 'process-unix'

[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'binary(/^process_/) | binary(=startup) | binary(=supervise) | binary(=fake_worker) | binary(=worker_channel) | binary(=unix_process) | binary(=windows_process) | binary(=windows_sockets) | binary(=endpoint) | binary(=migrate) | binary(=subcommands)'
test-group = 'process-windows'

# The workspace test job runs the default profile, which has no termination
# limit. The process binaries there keep the same concurrency groups.
[[profile.default.overrides]]
platform = 'cfg(unix)'
filter = 'binary(/^process_/) | binary(=startup) | binary(=supervise) | binary(=fake_worker) | binary(=worker_channel) | binary(=unix_process) | binary(=windows_process) | binary(=windows_sockets) | binary(=endpoint) | binary(=migrate) | binary(=subcommands)'
test-group = 'process-unix'

[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'binary(/^process_/) | binary(=startup) | binary(=supervise) | binary(=fake_worker) | binary(=worker_channel) | binary(=unix_process) | binary(=windows_process) | binary(=windows_sockets) | binary(=endpoint) | binary(=migrate) | binary(=subcommands)'
test-group = 'process-windows'
