[package]
name = "open-ferry-parity"
description = "Differential tests of open-ferry's translators against upstream CLIProxyAPI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
http = "1.5.0"
open-ferry-core = { workspace = true, features = ["parity"] }
open-ferry-providers.workspace = true
open-ferry-translate.workspace = true
serde_json.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
ureq = "3.4.2"

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "=2.0.119", features = ["full", "visit"] }
