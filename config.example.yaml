# Ported from CLIProxyAPI config.example.yaml (v8.0.15, MIT).
# https://github.com/router-for-me/CLIProxyAPI
#
# open-ferry's configuration template, using the v8 layout.
# Copy this file to config.yaml and replace the client keys and any enabled examples.
# Optional upstream credentials and request rules remain commented until configured.
#
# Only the settings open-ferry reads are listed here. CLIProxyAPI's others, such as the
# model catalog sources, LAN discovery, session affinity, client cloaking, the Antigravity,
# Devin, AI Studio and Kimi providers, pprof, plugins and Home mode, are left out; see
# UPSTREAM.md for what isn't ported. A CLIProxyAPI config that has them still loads, and
# open-ferry ignores them.
#
# Existing legacy configuration files and /v0/management requests remain supported.
# When both spellings of a field are present, the v8 value wins (including false,
# 0, and empty collections). Loading never writes the file, so the legacy field stays
# in it until a configuration write through /v8/management moves the file to the v8 layout.
# Legacy-only fields still work. GET requests and config-version: 8 alone do not
# migrate a legacy file; a successful configuration write through /v8/management does.
# The compatibility notes at the end show old spellings for existing deployments.
config-version: 8

# Listener, TLS, and server operation.
server:
  # Server host/interface to bind to. Default is empty ("") to bind all interfaces (IPv4 + IPv6).
  # Use "127.0.0.1" or "localhost" to restrict access to local machine only.
  host: ""

  # Server port
  port: 8317

  # IP addresses or CIDRs of proxies allowed to supply forwarded client IP headers.
  # An empty list (the default) does not trust forwarded headers. Restart after changing this setting.
  trusted-proxies: []
  # Example:
  # trusted-proxies:
  #   - 127.0.0.1
  #   - 192.0.2.0/24

  # TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
  tls:
    enable: false
    cert: ""
    key: ""

  # When true, write no request logs, not even a failed request's error log, to reduce
  # per-request memory usage under high concurrency.
  commercial-mode: false

# Management API settings
management:
  # Whether to allow remote (non-localhost) management access.
  # When false, only localhost can access management endpoints (a key is still required).
  allow-remote: false

  # Management key: the key itself, or its bcrypt hash. A plain key is compared as written,
  # and open-ferry doesn't replace it with a hash in this file.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for /v0/management and /v8/management routes).
  secret-key: ""

  # When true, the dashboard's pages (/dashboard/ and /management.html) answer 404.
  disable-control-panel: false

  # Base URL of the remote management API for the terminal UI (open-ferry -tui).
  # Defaults to http://127.0.0.1:<port> if not set. Can also be set with -management-base-url.
  # base-url: "https://proxy.example.com"

# Client authentication for the proxy API. These are not upstream provider keys.
access:
  # API keys for authentication
  # While one of these example keys is listed, the proxy refuses service (safe mode):
  # replace them with your own.
  api-keys:
    - "your-api-key-1"
    - "your-api-key-2"
    - "your-api-key-3"

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "round-robin" # round-robin (default), weighted-round-robin, fill-first
  # weighted-round-robin uses each credential's integer weight (default 1, maximum 1,000,000).
  # Non-positive weights exclude the credential while this strategy is active.
  # For OAuth/file credentials, add a top-level numeric "weight" field to the auth JSON.

  # When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
  force-model-prefix: false

  retry:
    # Number of additional credential retry rounds after the first round exhausts
    # its eligible credentials. Round 0 is the initial round; round r only admits
    # credentials whose effective request-retry is at least r. Explicit non-negative
    # credential/provider overrides take precedence; omitted or negative overrides
    # inherit this global value, and explicit 0 only admits round 0.
    # Additional rounds apply to HTTP 403, 408, 429, 500, 502, 503, and 504 failures.
    # Individual credential/provider overrides take precedence; 0 disables additional
    # rounds, while an omitted or negative override inherits this global setting.
    request-retry: 3

    # Maximum number of different credentials to try in each credential retry round
    # after per-credential round filtering. Set to 0 to try all available
    # credentials. Credentials skipped by this cap still age with the global round,
    # so the cap does not guarantee a fixed number of actual retries per credential.
    max-retry-credentials: 0

    # Maximum cooldown wait in seconds between retry rounds.
    # Set to 0 or below to never wait for credential cooldown.
    # Retry rounds that need no wait remain controlled by request-retry.
    max-retry-interval: 30

  cooldown:
    # When true, disable auth/model cooldown scheduling globally (prevents blackout windows after failure states).
    # A credential/provider disable-cooling value, when present, overrides this global value.
    disable-cooling: false

    # When true, persist per-auth cooldown status as .cds files next to auth files.
    # Default is false; when false, cooldown status is kept in memory only.
    save-cooldown-status: false

    # Cooldown duration in seconds for transient upstream errors (408/500/502/503/504/520-526).
    # Set to 0 to keep the legacy 60-second cooldown; set to -1 to disable transient error cooldowns.
    transient-error-cooldown-seconds: 0

# Shared request/response behavior.
requests:
  # Proxy URL. Supports http/https protocols. Example: http://user:pass@192.168.1.1:3128/
  # SOCKS5 proxies aren't supported yet, so open-ferry won't send requests through one.
  # Per-entry proxy-url also supports "direct" or "none" to bypass both the global proxy-url and environment proxies explicitly.
  proxy-url: ""

  # When true, forward filtered upstream response headers to downstream clients.
  # Default is false (disabled).
  passthrough-headers: false

  # When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
  nonstream-keepalive-interval: 0

  # Streaming behavior (SSE keep-alives + safe bootstrap retries).
  # streaming:
  #   keepalive-seconds: 15   # Default: 0 (disabled). <= 0 disables keep-alives.
  #   bootstrap-retries: 1    # Default: 0 (disabled). Retries before first byte is sent.

  # Optional payload configuration
  # payload:
  #   default: # Default rules only set parameters when they are missing in the payload.
  #     - models:
  #         - name: "gemini-2.5-pro" # Supports wildcards (e.g., "gemini-*")
  #           protocol: "gemini" # restricts the rule to a specific protocol, options: openai, gemini, claude, codex, interactions, xai, meta
  #           from-protocol: "responses" # restricts the rule to the source protocol, options: openai, responses, gemini, claude
  #           headers: # all configured request headers must match; values support "*" wildcards
  #             X-Client-Tier: "tenant-*-region-*"
  #           match: # all payload JSON paths must equal the configured values
  #             - "metadata.client": "codex"
  #           not-match: # payload JSON paths must not equal the configured values
  #             - "metadata.mode": "dev"
  #           exist: # all payload JSON paths must exist and not be null
  #             - "tools.#(type==\"web_search\").type"
  #           not-exist: # all payload JSON paths must be missing or null
  #             - "metadata.disable_payload"
  #       params: # JSON path (gjson/sjson syntax) -> value
  #         "generationConfig.thinkingConfig.thinkingBudget": 32768
  #   default-raw: # Default raw rules set parameters using raw JSON when missing (must be valid JSON).
  #     - models:
  #         - name: "gemini-2.5-pro" # Supports wildcards (e.g., "gemini-*")
  #           protocol: "gemini" # restricts the rule to a specific protocol, options: openai, gemini, claude, codex, interactions, xai, meta
  #       params: # JSON path (gjson/sjson syntax) -> raw JSON value (strings are used as-is, must be valid JSON)
  #         "generationConfig.responseJsonSchema": "{\"type\":\"object\",\"properties\":{\"answer\":{\"type\":\"string\"}}}"
  #   override: # Override rules always set parameters, overwriting any existing values.
  #     - models:
  #         - name: "gpt-5.4-fast"
  #           protocol: "codex"
  #         - name: "gpt-5.5-fast"
  #           protocol: "codex"
  #       params:
  #         service_tier: priority
  #     - models:
  #         - name: "gpt-*" # Supports wildcards (e.g., "gpt-*")
  #           protocol: "codex" # restricts the rule to a specific protocol, options: openai, gemini, claude, codex, interactions, xai, meta
  #       params: # JSON path (gjson/sjson syntax) -> value
  #         "reasoning.effort": "high"
  #     - models:
  #         - name: "claude-fable-5-1"
  #           protocol: "claude"
  #       params:
  #         max_tokens: 128000 # override the final Claude Messages output budget after protocol translation
  #   override-raw: # Override raw rules always set parameters using raw JSON (must be valid JSON).
  #     - models:
  #         - name: "gpt-*" # Supports wildcards (e.g., "gpt-*")
  #           protocol: "codex" # restricts the rule to a specific protocol, options: openai, gemini, claude, codex, interactions, xai, meta
  #       params: # JSON path (gjson/sjson syntax) -> raw JSON value (strings are used as-is, must be valid JSON)
  #         "response_format": "{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"answer\",\"schema\":{\"type\":\"object\"}}}"
  #   filter: # Filter rules remove specified parameters from the payload.
  #     - models:
  #         - name: "gemini-2.5-pro" # Supports wildcards (e.g., "gemini-*")
  #           protocol: "gemini" # restricts the rule to a specific protocol, options: openai, gemini, claude, codex, interactions, xai, meta
  #       params: # JSON paths (gjson/sjson syntax) to remove from the payload
  #         - "generationConfig.thinkingConfig.thinkingBudget"
  #         - "generationConfig.responseJsonSchema"
  #     - models:
  #         - name: "gpt-*" # Supports wildcards (e.g., "gpt-*")
  #           protocol: "codex"
  #       params:
  #         # Flat tools array (standard OpenAI format or Codex CLI < 0.154):
  #         - 'tools.#(name=="apply_patch")'
  #         # Nested additional_tools structure in input[] (Codex CLI >= 0.154 "Responses Lite"):
  #         - 'input.#(type=="additional_tools")#.tools.#(name=="functions")#.tools.#(name=="apply_patch")#'

# Client-facing compatibility settings apply to both OAuth and API-key routes.
client:
  codex:
    # When false (default), only models that natively declare freeform apply_patch advertise it.
    # When true, non-template and bridged models supported by every routing executor also advertise "freeform".
    enable-apply-patch: false
    # When true, optimize Codex Desktop, codex-tui, and codex_cli_rs requests for multi-agent v2.
    # This refreshes Codex spawn_agent model details, removes message parameter encryption,
    # normalizes encrypted agent_message content for Codex, and converts agent_message input
    # into standard user messages for non-Codex upstream protocols.
    # Default false. Applies to both OAuth and API-key credentials across providers.
    # Legacy provider paths migrate here; this path wins conflicts, including explicit false.
    optimize-multi-agent-v2: false

# Shared upstream behavior applies to OAuth and API-key credentials.
upstream:
  codex:
    # Experimental full-duplex Codex Responses WebSocket steering (default: false).
    # Keeps one upstream account/model per socket; accepted input is never replayed.
    response-steering: false
    # Hold back the frames that carry nothing the client has seen - the handshake (response.created,
    # response.in_progress, the websocket metadata frames), keepalive heartbeats, and the *.added
    # announcements of an item or part that is still empty - until the upstream emits its first
    # generated event. Anything else, including a server-side tool item such as web_search_call and
    # any frame not on that list, releases the stream immediately. On the SSE transport the lines that
    # are not `data:` frames - comments, `event:` lines, blank separators - are held alongside them.
    # The hold is bounded by a frame budget and a 1 MiB byte budget, not by wall-clock time: an
    # upstream that trickles frames holds the response headers for as long as the client will wait.
    # Why: the upstream smuggles `server_is_overloaded` rejections *inside* an HTTP 200 stream,
    # right after those handshake events, instead of returning 503 on the wire. Buffering them
    # keeps the downstream response headers uncommitted long enough to transparently retry on
    # another credential. Only overload/rate-limit rejections trigger failover; every other terminal
    # failure is still delivered in-stream exactly as before. One pre-existing behaviour is worth
    # knowing, because this option makes the window it lives in much longer: if the stream ends while
    # the bootstrap is still holding, the attempt ends instead of the error reaching the client, and
    # whether another credential is then tried depends on how it ended. A clean end with no terminal
    # event is request-scoped on SSE, so nothing else is tried; a websocket close, or a transport error
    # such as a dropped connection on either transport, is not, so the request may be retried on
    # another credential. None of that is new, but before this option the hold ended at the first
    # keepalive, so it was rare; now it can span the whole reasoning phase.
    # Trade-off: response headers are delayed until generation starts. Because heartbeats are held
    # too, the delay now ends at the first generated token rather than at the first heartbeat. The
    # budget bounds how much is held, not how long: 48 SSE lines, which measures out as 15 heartbeats
    # of the three-line event:/data:/blank shape, 23 of a two-line ": keepalive" comment followed by
    # its blank separator, or 47 of a bare ": keepalive" with no separator - one short of the obvious
    # division, because the rejection frame's own event: line comes out of the same budget before its
    # data: line is parsed. An upstream that sends the rejection as a bare data: line with no event:
    # line gets the round number instead. At a 10s upstream heartbeat that is 150s, 230s or 470s of
    # uncommitted response headers depending on the framing the upstream picks, all of it past nginx's
    # 60s default proxy_read_timeout, so raise the timeouts in front of the proxy before enabling this.
    # Those seconds bound what the buffer holds, not when the response headers are committed. Headers
    # are committed on the first chunk the downstream translator actually produces, so for a format
    # that renders the handshake as nothing - Chat Completions and Gemini do - they stay uncommitted
    # past the budget, until the first generated token. That is not specific to the budget: any frame
    # that releases the buffer has always behaved this way.
    # The websocket transport spends the same 48 differently - one per message read, whether the loop
    # holds it or skips it, with no framing to divide by - so there it is 48 heartbeats, about 480s.
    # Two cases no budget covers: a websocket peer that sends only ping frames, which the library
    # answers inside the read call, leaving only the 5 minute websocket read deadline; and an upstream
    # that stops mid-line on SSE, where the scanner never returns and only the request context ends the
    # wait. Neither is made worse by this option - with it off the same stalled line stalls the
    # conductor instead, which waits on the same context - but a client-side request timeout, not
    # proxy_read_timeout, is what bounds them.
    # Default: false
    stream-bootstrap-buffering: false
    # Optional maximum duration to hold back uncommitted response headers during bootstrap buffering.
    # When set (e.g. "20s"), if the time ceiling is reached before the first generated token,
    # the stream is released to the client and further in-stream overloads are delivered rather
    # than failed over. This bounds how long trickled heartbeats or early empty frames can delay
    # response headers before streaming begins.
    # Recommendation: If open-ferry is deployed behind a reverse proxy with a strict read timeout
    # (e.g. Nginx default proxy_read_timeout 60s or Cloudflare 100s timeout), setting this to "20s"
    # is strongly recommended to guarantee headers commit well before proxy timeouts while retaining
    # a comfortable 20s window to fail over early scheduling overloads.
    # Note: The timeout check is evaluated as upstream frames arrive; it never aborts the upstream
    # connection. Downstream headers are committed as soon as the downstream translator emits chunks
    # (for formats that render handshake/heartbeats, headers commit immediately on release; for
    # formats like Chat Completions and Gemini that render nothing until the first text token, headers
    # commit when that first token arrives).
    # When unset or set to "0", "0s", "none", "unlimited", "disabled", "off", or "never", no time ceiling
    # is applied, and buffering relies purely on the 48-frame and 1MB byte budget.
    # Default: "0" (unlimited)
    stream-bootstrap-timeout: "0"
    # When true, enable opt-in compatibility for orphan Codex delegation outputs.
    # Converts orphan function_call_output items from codex_app/create_thread and
    # codex_app/send_message_to_thread (which lack a valid call_id or matching function_call)
    # into standard user messages across Responses and non-Codex protocols when the request
    # header contains X-Openai-Subagent: collab_spawn.
    orphan-delegation-compatibility: false
    # When true, scope Codex usage_limit_reached quota cooldowns to the requested model rather
    # than cooling down the entire credential across all sibling models.
    # Default: false
    model-level-cooling: false

  claude:
    # When true, scope quota cooldowns to the requested model rather than cooling down
    # the entire credential across all sibling models. Default is false.
    model-level-cooling: false

  xai:
    # When true, inject the native x_search tool when the request does not declare it.
    # The injected tool is also added to tool_choice.allowed_tools when applicable.
    inject-x-search: false

# API-key upstreams are separate from access.api-keys (client authentication).
# Each provider contains named groups: one base-url, shared settings, and a keys list.
# Add another group for another endpoint; base-url belongs to the group, not a key.
# Shared settings retain their provider-specific validation and meaning.
# Missing/null per-key overrides inherit the group value, then the runtime fallback.
# Explicit false, 0, empty strings, and empty collections override inheritance when
# supported by the field. Map/list overrides replace the inherited value as a whole.
# Negative request-retry values retain the global fallback; weight belongs to each key.
# An empty proxy-url falls back to requests.proxy-url; direct bypasses proxy settings.
# Shared provider defaults belong to upstream.
# Keep differing legacy policies in separate groups or preserve them as key overrides.
# A header that names the calling client or its session, such as User-Agent, can't be
# set through headers (see UPSTREAM.md).
# Uncomment the api-keys root and only the provider examples you want to configure.
# Replace placeholder keys/URLs before using them.

